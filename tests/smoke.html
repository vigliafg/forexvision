<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>ForexVision - smoke test interfaccia</title>
<style>
  body{background:#0b1017;color:#e6edf7;font:13px/1.5 "JetBrains Mono",monospace;margin:0}
  #log{padding:14px}
  .pass{color:#18c98a}.fail{color:#f2555a}.info{color:#8fa3bf}
  #summary{font-size:18px;font-weight:700;padding:8px 12px;border:1px solid #22304a;border-radius:8px;background:#141d2b;display:inline-block;margin:12px 14px}
  iframe{width:1400px;height:2000px;border:0;position:absolute;left:-10000px;top:0}
</style>
</head>
<body>
<div id="summary">in esecuzione...</div>
<div id="log"></div>
<script>
  // La tab attiva viene ricordata in localStorage: si azzera PRIMA che l'app
  // venga caricata, cosi' lo stato di partenza non dipende dai click fatti in
  // una sessione precedente (il controllo sulla tab iniziale resta veritiero).
  try { localStorage.removeItem('forexvision.tab'); } catch (e) { /* storage assente */ }
</script>
<iframe id="app" src="../index.html?sim=1"></iframe>
<script src="expected.js"></script>
<script>
(function () {
  var out = document.getElementById('log');
  var lines = [], pass = 0, fail = 0;

  function log(ok, label, extra) {
    ok ? pass++ : fail++;
    var p = document.createElement('pre');
    p.className = ok ? 'pass' : 'fail';
    p.textContent = (ok ? 'PASS  ' : 'FAIL  ') + label + (extra ? '   |  ' + extra : '');
    out.appendChild(p);
    lines.push(p.textContent);
  }
  function info(t) {
    var p = document.createElement('pre');
    p.className = 'info';
    p.textContent = t;
    out.appendChild(p);
    lines.push(t);
  }
  function $(sel, root) { return (root || frame.contentDocument).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || frame.contentDocument).querySelectorAll(sel)); }
  function canvasHasContent(cv, root) {
    try {
      var ctx = cv.getContext('2d');
      var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      var first = [d[0], d[1], d[2]], distinct = false;
      for (var i = 4; i < d.length; i += 4 * 97) {
        if (d[i] !== first[0] || d[i + 1] !== first[1] || d[i + 2] !== first[2]) { distinct = true; break; }
      }
      return distinct;
    } catch (e) { return false; }
  }

  var frame = document.getElementById('app');
  var started = false;

  // Il nucleo dell'app e' pronto quando ha disegnato prezzo e backtest.
  function coreReady(d, w) {
    if (!d || d.readyState !== 'complete' || !w || !w.ForexData) return false;
    var lp = d.getElementById('lastPrice');
    return !!lp && /\d/.test(lp.textContent) &&
      d.querySelectorAll('#btStats .stat').length >= 8;
  }

  // Lo studio di efficacia e' differito: e' pronto quando la sua didascalia
  // non dice piu' "in calcolo". Il numero di righe NON si usa come segnale di
  // prontezza: senza un ATR valido il rilevatore ripiega sul solo RSI e la
  // tabella resta piu' corta, quindi un minimo di righe bloccherebbe il test
  // invece di farlo fallire. Che le righe siano complete lo verificano i
  // controlli stessi.
  function studyDone(d) {
    var sc = d.getElementById('divStudyScope');
    return !!sc && sc.textContent.trim() !== '' && sc.textContent.indexOf('in calcolo') < 0;
  }

  function appReady() {
    var d = frame.contentDocument, w = frame.contentWindow;
    return coreReady(d, w) && studyDone(d);
  }

  function begin() {
    if (started) return;
    started = true;
    runChecks();
  }

  // Il via arriva dai cambi del DOM interno (MutationObserver), non da un
  // timer: nelle schede non visibili i timer vengono rallentati o congelati,
  // mentre l'osservatore reagisce subito. Il setTimeout e' solo una rete di
  // sicurezza per il caso in cui il documento interno venga sostituito.
  var observedDoc = null;
  var boot = Date.now();
  function arm() {
    if (started) return;
    if (appReady()) { begin(); return; }
    var d = frame.contentDocument, w = frame.contentWindow;
    // rete di sicurezza: se dopo 20 secondi lo studio differito non e'
    // arrivato, si parte comunque. I controlli falliranno in modo esplicito
    // invece di lasciare il test bloccato su "in esecuzione...".
    if (coreReady(d, w) && Date.now() - boot > 20000) { begin(); return; }
    if (d && d.documentElement && d !== observedDoc) {
      observedDoc = d;
      var mo = new MutationObserver(function () {
        if (started) { mo.disconnect(); return; }
        if (appReady()) { mo.disconnect(); begin(); }
      });
      mo.observe(d.documentElement, {
        childList: true, subtree: true, characterData: true
      });
    }
    frame.addEventListener('load', arm, { once: true });
    setTimeout(arm, 700);
  }
  arm();

  function report() {
    var sum = document.getElementById('summary');
    sum.textContent = (fail === 0 ? 'SMOKE TEST SUPERATO: ' : 'SMOKE TEST FALLITO: ') + pass + '/' + (pass + fail + ' test');
    sum.className = fail === 0 ? 'pass' : 'fail';
    lines.push('');
    lines.push('SUMMARY: ' + sum.textContent);
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/report', false);
      xhr.setRequestHeader('Content-Type', 'text/plain');
      xhr.send(lines.join('\n'));
    } catch (e) {}
  }

  function runChecks() {
    var w = frame.contentWindow, doc = frame.contentDocument;

    log(!!w.ForexData && !!w.Indicators && !!w.Forecast && !!w.ForexChart, 'I quattro moduli JS sono caricati nel documento');

    // prezzi e intestazione
    var lp = $('#lastPrice').textContent.trim();
    log(/^\d/.test(lp), 'Prezzo di mercato valorizzato', 'ultimo prezzo = ' + lp);
    log(/\d/.test($('#lastChange').textContent), 'Variazione percentuale mostrata', $('#lastChange').textContent.trim());
    log($('#chartTitle').textContent.indexOf('EUR/USD') === 0, 'Titolo del grafico coerente', $('#chartTitle').textContent);
    log(/\d{1,2}:\d{2}/.test($('#clock').textContent), 'Orologio attivo', $('#clock').textContent);

    // segnale
    var badge = $('#signalBadge');
    var dir = $('#signalBadge .signal-dir').textContent.trim();
    log(/^(ACQUISTO|VENDITA|NEUTRO)$/.test(dir), 'Direzione del segnale mostrata', dir);
    log(/buy|sell|neutral/.test(badge.className), 'Badge con classe di stato', badge.className);
    log(/%/.test($('#signalBadge .signal-conf').textContent), 'Confidenza mostrata', $('#signalBadge .signal-conf').textContent.trim());
    var gaugeLeft = $('#gaugeFill').style.left;
    log(/%$/.test(gaugeLeft), 'Indicatore di sintesi posizionato', gaugeLeft);

    // piano operativo
    ['planEntry', 'planTp', 'planSl', 'planRr', 'planExp', 'planAtr'].forEach(function (id) {
      var v = $('#' + id).textContent.trim();
      log(v && v !== '\u2014', 'Piano operativo: ' + id + ' valorizzato', v);
    });
    var tp = parseFloat($('#planTp').textContent), sl = parseFloat($('#planSl').textContent), en = parseFloat($('#planEntry').textContent);
    log(tp !== en && sl !== en && (tp - en) * (sl - en) < 0, 'TP e SL ai lati opposti del prezzo di ingresso',
      'entry ' + en + ' tp ' + tp + ' sl ' + sl);

    // motivazioni e proiezione
    log($$('#reasonList li').length >= 5, 'Elenco motivazioni compilato', 'righe = ' + $$('#reasonList li').length);
    log($$('#fcSummary .fc-tile').length === 6, 'Sei riquadri di sintesi previsionale', 'tile = ' + $$('#fcSummary .fc-tile').length);
    log($$('#fcLevels .lvl').length === 8, 'Otto barre di probabilità sui livelli', 'barre = ' + $$('#fcLevels .lvl').length);
    var w0 = $$('#fcLevels .lvl-fill').map(function (e) { return parseInt(e.style.width, 10); });
    log(w0.every(function (v) { return v >= 1 && v <= 97; }), 'Larghezze delle barre entro 1-97%', w0.slice(0, 4).join(',') + ' ...');

    // indicatori
    log($$('#indTable tbody tr').length >= 24, 'Tabella indicatori popolata (classici piu\u0300 trend e inversione)',
      'righe = ' + $$('#indTable tbody tr').length);
    log($$('#trendBlock .gauge-tile').length >= 10 && $$('#trendBlockTech .gauge-tile').length >= 10,
      'Indicatori di trend e inversione sia sotto il grafico sia nella tab analisi tecnica',
      $$('#trendBlock .gauge-tile').length + ' tile sotto il grafico \u00b7 ' +
      $$('#trendBlockTech .gauge-tile').length + ' tile nella tab tecnica');
    log($$('#divBlock .gauge-tile').length === 2 && $$('#divBlockChart .gauge-tile').length === 2,
      'Riquadri di sintesi di divergenze e pivot nei due pannelli');
    var trendTxt = $('#trendBlock').textContent + ' ' + $('#trendBlockTech').textContent;
    log(/SuperTrend/.test(trendTxt) && /Ichimoku/.test(trendTxt) && /Aroon/.test(trendTxt) &&
      /Vortex/.test(trendTxt) && /CCI/.test(trendTxt) && /Choppiness/.test(trendTxt) && /Keltner/.test(trendTxt),
      'Tutti gli indicatori di trend e inversione previsti sono presenti');
    log(/pip/.test(trendTxt), 'Le distanze sono espresse in pip');
    log($$('.chart-toggles .chip').length === 11, 'Undici sovrapposizioni selezionabili sul grafico',
      $$('.chart-toggles .chip').length + ' chip');
    log($$('#divList li').length >= 1 && $$('#divListChart li').length >= 1 &&
      $$('#pivotGrid .kpi').length === 7 && $$('#pivotGridChart .kpi').length === 7,
      'Divergenze e pivot sotto il grafico e nella tab analisi tecnica',
      $$('#divList li').length + ' righe divergenze \u00b7 ' + $$('#pivotGrid .kpi').length + ' livelli pivot');
    log(/R3|Pivot/.test($('#pivotGrid').textContent) && /S3/.test($('#pivotGrid').textContent),
      'Livelli di pivot mostrati da R3 a S3');

    // studio di efficacia delle divergenze (differito, come il backtest)
    var stRows = $$('#divStudy table tbody tr'), stRows2 = $$('#divStudyChart table tbody tr');
    log(stRows.length >= 3 && stRows2.length === stRows.length &&
      $$('#divStudy table thead th').length === 6 &&
      /^tutte$/.test(stRows[0].querySelector('td').textContent),
      'Studio di efficacia delle divergenze nei due pannelli',
      stRows.length + ' righe \u00b7 ' + $$('#divStudy table thead th').length + ' colonne');
    var stTxt = $('#divStudy') ? $('#divStudy').textContent : '';
    log(/Casi/.test(stTxt) && /A favore/.test(stTxt) && /R medio/.test(stTxt) &&
      /Incertezza/.test(stTxt) && /PF/.test(stTxt),
      'Lo studio mostra casi, quota a favore, rendimento medio, incertezza e profit factor');
    log(/tutte/.test(stTxt) && /regolari/.test(stTxt) && /nascoste/.test(stTxt) &&
      /RSI/.test(stTxt) && /MACD/.test(stTxt),
      'Lo studio ripartisce per tipo di divergenza e per oscillatore');
    log(stRows.every(function (tr) {
        var tds = tr.querySelectorAll('td');
        return tds.length === 6 && /^\d+$/.test(tds[1].textContent) && /%$/.test(tds[2].textContent) &&
          /^[+-]?\d+\.\d{2}$/.test(tds[3].textContent) && /\u00b1\d+\.\d{2}$/.test(tds[4].textContent) &&
          /^([\d.]+|\u221e)$/.test(tds[5].textContent);
      }), 'Le righe dello studio sono numeriche e complete', stRows.length + ' righe');
    log(/(\d+ casi su \d+ barre, esito a \d+ barre|nessun caso misurabile nella finestra di \d+ barre)/
      .test($('#divStudyScope').textContent) &&
      /nessun vantaggio misurabile|vantaggio misurabile|esito medio negativo/.test(stTxt),
      'Lo studio dichiara quanti casi ha misurato e il verdetto', $('#divStudyScope').textContent);
    log($('#divStudyChart').textContent === stTxt && $$('.div-study .verdict').length === 2,
      'Lo studio e il verdetto coincidono nei due pannelli');

    // --- spiegazioni delle card: un bottone su ogni card e su ogni grafico ---
    var helpKeys = w.CardHelp ? w.CardHelp.keys() : [];
    var helpBtns = $$('.card-help');
    var cardsWithout = $$('.card').filter(function (c) { return !c.querySelector('.card-help'); });
    log(!!w.CardHelp && cardsWithout.length === 0 && helpBtns.length >= 19,
      'Ogni card ha il bottone che la spiega',
      $$('.card').length + ' card \u00b7 ' + helpBtns.length + ' bottoni (grafici compresi)');
    var unknownKeys = helpBtns.map(function (b) { return b.getAttribute('data-help-key'); })
      .filter(function (k) { return !/^[a-zA-Z]+$/.test(k) || helpKeys.indexOf(k) < 0; });
    log(unknownKeys.length === 0, 'Ogni bottone punta a una spiegazione esistente',
      'chiavi senza spiegazione = ' + (unknownKeys.join(', ') || 'nessuna'));
    log(helpKeys.length === helpBtns.length,
      'Le spiegazioni disponibili corrispondono ai bottoni disegnati',
      helpKeys.length + ' spiegazioni per ' + helpBtns.length + ' bottoni');
    var chartHelpBtns = $$('.chart-help-row .card-help').map(function (b) { return b.getAttribute('data-help-key'); });
    log(chartHelpBtns.length === 2 && chartHelpBtns.indexOf('spark') >= 0 && chartHelpBtns.indexOf('equity') >= 0,
      'Anche i grafici minori hanno il proprio bottone', chartHelpBtns.join(', '));

    // ogni bottone apre la sua finestra, con tre sezioni e testo utile
    var helpBad = [], helpTitles = [], helpBullets = 0;
    helpBtns.forEach(function (b) {
      b.click();
      var key = b.getAttribute('data-help-key');
      var body = $('#helpBody'), title = $('#helpTitle').textContent.trim();
      var text = body.textContent || '';
      var h2 = $$('#helpBody .rep-h2').map(function (x) { return x.textContent; });
      if (h2.length !== 3 || !/Che cosa mostra questa card/.test(h2[0]) || !/Come si legge/.test(h2[1]) ||
        !/In questo momento/.test(h2[2])) helpBad.push(key + ':sezioni');
      if (!title) helpBad.push(key + ':titolo');
      if (/undefined|NaN|\[object|Infinity|null/.test(text)) helpBad.push(key + ':valori');
      if ($$('#helpBody .rep-ul li').length < 3) helpBad.push(key + ':righe');
      if (!/^[\w\s\u00c0-\u00ff'\(\)&\.—-]+$/.test(title)) helpBad.push(key + ':titolo-strano');
      helpTitles.push(title); helpBullets += $$('#helpBody .rep-ul li').length;
    });
    log(helpBad.length === 0, 'Tutte le finestre si aprono con le tre sezioni e senza valori senza senso',
      helpBtns.length + ' finestre \u00b7 ' + helpBullets + ' righe \u00b7 problemi = ' + (helpBad.join(', ') || 'nessuno'));
    log(helpTitles.filter(function (t) { return !!t; }).length === helpBtns.length,
      'Ogni finestra ha il titolo della card che l\u2019ha aperta', helpTitles.slice(0, 4).join(' / ') + ' ...');

    // la finestra resta aperta e si aggiorna seguendo lo stato della pagina
    log(!$('#helpOverlay').classList.contains('hidden') &&
      /EUR\/USD/.test($('#helpSubtitle').textContent) && /simulati/.test($('#helpSubtitle').textContent),
      'La didascalia dichiara coppia e natura dei dati', $('#helpSubtitle').textContent);
    var chipPivot = $$('.chart-toggles .chip').filter(function (c) { return c.dataset.layer === 'pivot'; })[0];
    chipPivot.click();
    $$('.card-help').filter(function (b) { return b.getAttribute('data-help-key') === 'chart'; })[0].click();
    log(/Sovrapposizioni accese: ([^.]*)/.test($('#helpBody').textContent) &&
      /Pivot/.test($('#helpBody').textContent.match(/Sovrapposizioni accese: ([^.]*)/)[1]),
      'La spiegazione del grafico segue le sovrapposizioni accese adesso',
      ($('#helpBody').textContent.match(/Sovrapposizioni accese: ([^.]*)/) || ['', ''])[1]);
    chipPivot.click();                       // Pivot di nuovo spento
    function overlayLine() {
      var m = $('#helpBody').textContent.match(/Sovrapposizioni accese: ([^.]*)/);
      return m ? m[1] : '';
    }
    // si riapre la finestra dopo aver spento la sovrapposizione, poi si confronta
    // la riga letta con lo stato vero dei pulsanti in quel momento
    $$('.card-help').filter(function (b) { return b.getAttribute('data-help-key') === 'chart'; })[0].click();
    var chipState = $$('.chart-toggles .chip.active').map(function (c) { return c.textContent.trim(); }).join(', ');
    log(overlayLine() === chipState && !/Pivot/.test(overlayLine()),
      'La lettura della finestra combacia con le sovrapposizioni accese adesso', overlayLine());

    // --- controllo incrociato: la tabella dei valori attesi, generata dai dati.
    // Qui non c'e' nessun numero scritto a mano: la tabella (tests/expected.js)
    // legge i dati dell'app e dichiara quali grandezze ogni spiegazione promette
    // di mostrare. Il test pretende che il testo citi quelle, che nessun numero
    // sia inventato e che le card mostrino gli stessi valori. Lettura e confronto
    // stanno nello stesso blocco sincrono: nessun aggiornamento puo' infilarsi
    // in mezzo, perche' i dati cambiano solo dentro il giro di disegno.
    var EV = window.ExpectedValues;
    // Il contesto dati si legge a ogni giro: il tick "live" puo' scattare fra
    // una spiegazione e l'altra, e dati e pagina devono restare lo stesso
    // istante (dentro un blocco sincrono, invece, non cambiano).
    function appData() { return w.ForexApp && w.ForexApp.context ? w.ForexApp.context() : null; }
    log(!!EV && !!appData(), 'La tabella dei valori attesi e il contesto dati dell\u2019app sono disponibili',
      EV ? EV.READS.length + ' letture dichiarate' : 'tabella assente');

    function helpButton(key) {
      return $$('.card-help').filter(function (b) { return b.getAttribute('data-help-key') === key; })[0];
    }
    // La lettura della sezione "In questo momento" e il confronto con le card
    // stanno nella tabella: sono gli stessi che usa la suite sui dati reali.
    function nowSectionText() { return EV.nowText($('#helpBody')); }
    // Se la chiave non esiste il test deve segnalarlo, non morire a meta'
    // strada: senza bottone il testo e' vuoto e i confronti falliscono in chiaro.
    function openHelp(key) {
      var b = helpButton(key);
      if (!b) return false;
      b.click();
      return true;
    }
    function helpText(key) { return openHelp(key) ? $('#helpBody').textContent : ''; }
    var helpKeysAll = w.CardHelp.keys();
    // Che cosa ogni spiegazione promette non e' scritto a mano: si legge dal
    // markup della pagina, cioe' da quali grandezze ogni pannello disegna.
    var derived = EV.contracts(doc);
    var domKeys = Object.keys(EV.owners(doc));
    var noPanel = helpKeysAll.filter(function (k) { return domKeys.indexOf(k) < 0; });
    var noCard = domKeys.filter(function (k) { return helpKeysAll.indexOf(k) < 0; });
    log(noPanel.length === 0 && noCard.length === 0,
      'Ogni spiegazione ha il suo pannello e ogni pannello la sua spiegazione',
      (noPanel.length || noCard.length)
        ? 'senza pannello: ' + (noPanel.join(', ') || 'nessuno') +
          ' \u00b7 senza spiegazione: ' + (noCard.join(', ') || 'nessuno')
        : domKeys.length + ' pannelli collegati');
    /* Un pannello che mostra numeri e non promette nessuna lettura e' un buco:
     * la sua spiegazione non e' legata a niente. Un pannello vuoto invece non
     * promette niente, ed e' giusto cosi'. */
    var ownersMap = EV.owners(doc);
    var silent = helpKeysAll.filter(function (k) {
      var shows = (ownersMap[k] || []).some(function (el) { return /\d/.test(el.textContent || ''); });
      return shows && !(derived[k] || []).length;
    });
    var promised = helpKeysAll.reduce(function (n, k) { return n + (derived[k] || []).length; }, 0);
    log(silent.length === 0, 'Nessun pannello che mostra numeri resta senza letture promesse',
      silent.length ? 'muti: ' + silent.join(', ')
        : promised + ' promesse derivate dai pannelli su ' + helpKeysAll.length + ' spiegazioni');
    var crossBad = [], crossMissing = [], crossEmpty = [], numbersSeen = 0, stampsSeen = 0;
    helpKeysAll.forEach(function (key) {
      var appCtx = appData();              // dati e pagina nello stesso istante
      helpText(key);                       // apre la finestra sulla card
      var r = EV.check(key, appCtx, nowSectionText(), derived[key]);
      numbersSeen += r.cited;
      stampsSeen += r.stamps.length;
      r.unresolved.forEach(function (c) { crossBad.push(key + ':' + c.raw); });
      r.unresolvedStamps.forEach(function (s) { crossBad.push(key + ':data ' + s.raw); });
      r.missing.forEach(function (m) { crossMissing.push(key + ':' + m); });
      if (r.promised > 0 && r.cited === 0) crossEmpty.push(key);
    });
    log(crossBad.length === 0, 'Nessun numero inventato: ogni cifra citata viene dai dati',
      numbersSeen + ' numeri in ' + helpKeysAll.length + ' spiegazioni \u00b7 fuori tabella = ' +
      (crossBad.join(', ') || 'nessuno'));
    log(crossMissing.length === 0, 'Ogni spiegazione cita davvero le grandezze che promette',
      'promesse non mantenute = ' + (crossMissing.join(', ') || 'nessuna'));
    log(crossEmpty.length === 0, 'Ogni spiegazione porta almeno un dato del momento',
      crossEmpty.length ? 'senza numeri: ' + crossEmpty.join(', ') : 'tutte con numeri');
    log(stampsSeen > 0, 'Date e orari citati corrispondono ai dati (calendario e orologio)',
      stampsSeen + ' date/orari verificati');
    var tableRows = EV.table(appData());
    var poolSize = EV.pool(appData()).length;
    log(tableRows.length >= 80 && poolSize >= 200,
      'La tabella dei valori attesi e\u2019 piena, non un guscio vuoto',
      tableRows.length + ' righe \u00b7 ' + poolSize + ' forme numeriche attese · ' +
      EV.STRUCT.length + ' costanti di formula dichiarate');

    // le card devono mostrare gli stessi valori che la tabella legge dai dati
    var cards = EV.compareCards(appData(), doc);
    log(cards.missing.length === 0, 'Ogni grandezza della tabella punta a una card presente',
      cards.checked + ' collegamenti \u00b7 selettori assenti = ' + (cards.missing.join(', ') || 'nessuno'));
    log(cards.bad.length === 0, 'Le card mostrano i valori letti dai dati',
      cards.checked + ' valori confrontati con la pagina \u00b7 scarti = ' + (cards.bad.join(' | ') || 'nessuno'));

    // i conteggi delle spiegazioni devono combaciare con le righe in elenco
    function countIn(sel) { return $$(sel).length; }
    var listBad = [];
    // SMC: "validi su individuati", quindi il sottoinsieme non puo' superare il totale
    var smcListTxt = helpText('smc');
    [[smcListTxt.match(/Order block: (\d+) ancora validi su (\d+) individuati/), 'order block'],
      [smcListTxt.match(/Fair value gap: (\d+) aperti su (\d+) individuati/), 'fair value gap'],
      [smcListTxt.match(/Livelli di liquidit[^:]*: (\d+) individuati, (\d+) ancora intatti/), 'liquidita']
    ].forEach(function (pair) {
      var m = pair[0];
      if (!m) { listBad.push(pair[1] + ': conteggio non trovato'); return; }
      if (pair[1] === 'liquidita') {
        if (Number(m[2]) > Number(m[1])) listBad.push(pair[1] + ': intatti ' + m[2] + ' > individuati ' + m[1]);
      } else if (Number(m[1]) > Number(m[2])) {
        listBad.push(pair[1] + ': validi ' + m[1] + ' > individuati ' + m[2]);
      }
    });
    // notizie: le righe in elenco non possono superare quelle ricevute, e devono
    // corrispondere a quante ne sono disegnate
    var newsM = helpText('news').match(/Titoli ricevuti: (\d+) \(in elenco: (\d+)\)/);
    if (!newsM) listBad.push('notizie: conteggio non trovato');
    else {
      if (Number(newsM[2]) > Number(newsM[1])) listBad.push('notizie: in elenco ' + newsM[2] + ' > ricevuti ' + newsM[1]);
      if (Number(newsM[2]) !== countIn('#newsList li')) {
        listBad.push('notizie: dichiara ' + newsM[2] + ', in elenco ' + countIn('#newsList li'));
      }
    }
    // divergenze: due pannelli, ciascuno confrontato con il proprio elenco
    [[ 'divChart', '#divListChart li:not(.empty)'], ['divTech', '#divList li:not(.empty)']].forEach(function (c) {
      var m = helpText(c[0]).match(/Divergenze attive: (\d+)/);
      var inList = countIn(c[1]);
      if (!m) listBad.push(c[0] + ': conteggio non trovato');
      else if (Number(m[1]) !== inList) listBad.push(c[0] + ': dichiara ' + m[1] + ', in elenco ' + inList);
    });
    log(listBad.length === 0, 'I conteggi della spiegazione reggono il confronto con gli elenchi',
      'problemi = ' + (listBad.join(' | ') || 'nessuno'));
    // e le quote dichiarate combaciano con le righe davvero disegnate
    // (i conteggi delle liste li verifica la tabella, che li legge dai dati)
    var smcTxt = helpText('smc');
    // la struttura e l'evento SMC devono coincidere con quanto scritto in cima alla card
    log(/Struttura rialzista/.test(smcTxt) === /Rialzista/.test($('#smcBias').textContent) &&
      /Ultimo evento di struttura: (BOS|CHoCH)/.test(smcTxt) &&
      $('#smcEvent').textContent.indexOf(smcTxt.match(/Ultimo evento di struttura: (BOS|CHoCH)/)[1]) >= 0,
      'Struttura, evento e punteggio della spiegazione combaciano con la card SMC',
      $('#smcBias').textContent.replace(/\s+/g, ' ').trim());
    var dvtTxt = helpText('dashVerdict');
    log($('#confVerdict').textContent.indexOf(dvtTxt.match(/Verdetto complessivo: (\w+)/)[1]) >= 0,
      'Il verdetto della spiegazione e quello della card sono lo stesso',
      dvtTxt.match(/Verdetto complessivo: \w+ con [\d\/a-z ]+/)[0]);
    var sentTxt = helpText('sentiment');
    log($('#sentBadge .sent-dir').textContent.trim() === sentTxt.match(/Lettura complessiva: (\w+)/)[1],
      'La lettura del sentiment combacia con il badge della card',
      $('#sentBadge .sent-dir').textContent.trim() + ' \u00b7 ' + sentTxt.match(/Lettura complessiva: \w+/)[0]);
    var evTxt = helpText('dashEvent');
    var evTitle = evTxt.match(/Prossimo evento: ([^\u00b7]+)/);
    log(!evTitle || $('#dashEvent').textContent.indexOf(evTitle[1].trim().slice(0, 18)) >= 0,
      'Il prossimo evento citato e quello mostrato nella card',
      evTitle ? evTitle[1].trim().slice(0, 28) : 'nessun evento in arrivo');
    $('#helpClose').click();

    // contenuto scorrevole: si restringe l'area visibile come su uno schermo
    // normale, altrimenti in un riquadro alto 2000px non serve scorrere
    var helpBody = $('#helpBody');
    var frameH = frame.style.height;
    frame.style.height = '700px';
    $$('.card-help').filter(function (b) { return b.getAttribute('data-help-key') === 'divChart'; })[0].click();
    var scrollabile = helpBody.scrollHeight > helpBody.clientHeight + 20;
    log(scrollabile, 'Il testo della finestra e\u2019 scorrevole su uno schermo normale',
      helpBody.clientHeight + 'px visibili su ' + helpBody.scrollHeight + 'px');
    log(w.getComputedStyle(helpBody).overflowY === 'auto',
      'Il riquadro del testo ha lo scorrimento abilitato nel foglio di stile',
      w.getComputedStyle(helpBody).overflowY);
    helpBody.scrollTop = 300;
    log(helpBody.scrollTop > 0 && helpBody.scrollTop <= helpBody.scrollHeight,
      'Lo scorrimento del testo funziona', 'posizione = ' + helpBody.scrollTop);
    var corpoAlto = Math.round(helpBody.getBoundingClientRect().height);
    log(corpoAlto <= 700 && corpoAlto > 200,
      'La finestra non supera l\u2019altezza dello schermo', corpoAlto + 'px su 700px di area');
    frame.style.height = frameH || '';
    $('#helpClose').click();
    log($('#helpOverlay').classList.contains('hidden'), 'La finestra si chiude con il bottone Chiudi');
    $$('.card-help').filter(function (b) { return b.getAttribute('data-help-key') === 'signal'; })[0].click();
    log(!$('#helpOverlay').classList.contains('hidden'), 'La finestra si riapre su un\u2019altra card');
    doc.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    log($('#helpOverlay').classList.contains('hidden'), 'La finestra si chiude con Esc');
    $$('.card-help').filter(function (b) { return b.getAttribute('data-help-key') === 'backtest'; })[0].click();
    var ov = $('#helpOverlay');
    ov.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    log(ov.classList.contains('hidden'), 'La finestra si chiude cliccando lo sfondo');
    log($('#planTrail').textContent !== '\u2014' && /pip/.test($('#planTrail').textContent),
      'Stop trailing del SuperTrend nel piano operativo', $('#planTrail').textContent);

    // watchlist
    log($$('#watchlist li').length === 14, 'Watchlist con tutti i 14 strumenti', 'voci = ' + $$('#watchlist li').length);
    log($$('#watchlist .wl-score').length === 14, 'Ogni voce ha un punteggio', 'prima = ' + $('#watchlist .wl-score').textContent.trim());

    // backtest
    log($$('#btStats .stat').length === 8, 'Otto statistiche di backtest', 'stat = ' + $$('#btStats .stat').length);
    log(/%/.test($('#btStats').textContent), 'Hit rate calcolato', $('#btStats .stat:nth-child(2) .v').textContent);
    log(canvasHasContent($('#equity'), doc), 'Curva equity disegnata sul canvas');

    // contesto
    log($$('#contextList li').length === 6, 'Sei voci di contesto di mercato', 'voci = ' + $$('#contextList li').length);

    // grafico principale
    log(canvasHasContent($('#chart'), doc), 'Grafico a candele renderizzato (pixel non uniformi)');
    log($('#chart').width > 400, 'Canvas del grafico dimensionato', $('#chart').width + 'x' + $('#chart').height);

    // journal: stato iniziale
    log($$('#journalBody tr.empty-row').length === 1 || $$('#journalBody tr[data-id]').length > 0, 'Registro operazioni inizializzato');

    // --- nuovi moduli: confluenza, SMC, sentiment -------------------
    log($$('#confGrid .conf-item').length === 3, 'Tre riquadri di confluenza (analisi tecnica, SMC, sentiment)',
      $$('#confGrid .conf-item .name').map(function (e) { return e.textContent; }).join(' | '));
    log(/analisi tecnica/.test($('#confStamp').textContent) && /SMC/.test($('#confStamp').textContent) &&
      /sentiment/.test($('#confStamp').textContent),
      'L\u2019intestazione elenca i tre studi', $('#confStamp').textContent);
    log($$('#confGrid .conf-item.excluded').length === 0,
      'In modalità simulata i tre studi entrano tutti nel verdetto');
    log(/\d/.test($('#confGrid .conf-item .val').textContent), 'Punteggi dei modelli mostrati',
      $('#confGrid .conf-item .val').textContent);
    log($$('#confVerdict .tag-big') && /^(ACQUISTO|VENDITA|NEUTRO)$/.test($('#confVerdict .tag-big').textContent),
      'Verdetto di confluenza mostrato', $('#confVerdict').textContent.slice(0, 80) + '\u2026');
    log($$('#tab-dash #confGrid').length === 1,
      'La griglia di dettaglio dei modelli resta nel cruscotto (tale e scritta)');
    log($$('#tab-dash #dashDials .gauge-tile').length === 3,
      'I tre modelli sono i dial del cruscotto', $$('#dashDials .gauge-tile').length + ' dial');

    log(/\d/.test($('#smcBias').textContent), 'Struttura SMC mostrata', $('#smcBias').textContent);
    log(/BOS|CHoCH|nessun/.test($('#smcEvent').textContent), 'Ultimo evento di struttura mostrato',
      $('#smcEvent').textContent.slice(0, 60));
    log(/%$/.test($('#pdMarker').style.left), 'Indicatore premio/sconto posizionato', $('#pdMarker').style.left);
    log(parseFloat($('#pdOte').style.width) > 0, 'Zona OTE evidenziata', $('#pdOte').style.width);

    log($$('#obList li').length > 0, 'Elenco order block popolato',
      $$('#obList li').length + ' righe: ' + ($('#obList li').textContent || '').trim().slice(0, 50));
    log($$('#fvgList li').length > 0, 'Elenco fair value gap popolato', $$('#fvgList li').length + ' righe');
    log($$('#liqList li').length > 0, 'Elenco pool di liquidità popolato', $$('#liqList li').length + ' righe');
    var lastP = parseFloat($('#lastPrice').textContent);
    var liqParsed = $$('#liqList li').map(function (li) {
      return {
        up: /LIQ \u2191/.test(li.textContent),
        v: parseFloat(li.querySelector('.zr').textContent)
      };
    });
    log(liqParsed.filter(function (x) { return x.up; }).every(function (x) { return x.v >= lastP; }) &&
      liqParsed.filter(function (x) { return !x.up; }).every(function (x) { return x.v <= lastP; }),
      'Pool di liquidità coerenti: sopra/sotto il prezzo corrente',
      'prezzo ' + lastP + ' \u00b7 pool ' + liqParsed.map(function (x) { return (x.up ? 'su ' : 'giu ') + x.v; }).join(', '));
    log($$('#smcPlan .cell').length === 6, 'Piano operativo SMC con sei celle', $$('#smcPlan .cell').length + ' celle');
    log(/LONG|SHORT/.test($('#smcPlan').textContent), 'Scenario SMC direzionale',
      $('#smcPlan .cell .v').textContent);
    log($$('#smcReasons li').length >= 4, 'Narrazione SMC presente', $$('#smcReasons li').length + ' righe');

    log($$('#strengthList li').length === 10, 'Forza valutata su 10 divise', $$('#strengthList li').length + ' righe');
    log($$('#strengthList .sbar i').every(function (e) {
      var w = parseFloat(e.style.width); return w > 0 && w <= 100;
    }), 'Barre di forza entro 0-100%', $('#strengthList li').textContent.replace(/\s+/g, ' ').trim());
    log(/%/.test($('#retailLabel').textContent), 'Posizionamento retail mostrato', $('#retailLabel').textContent);
    log(/%$/.test($('#riskFill').style.left), 'Indicatore di rischio posizionato', $('#riskFill').style.left);
    log($$('#riskList li').length === 4, 'Quattro indicatori di regime', $$('#riskList li').length + ' righe');
    log($$('#instList li').length === 4, 'Posizionamento istituzionale mostrato', $$('#instList li').length + ' righe');
    log(/^(FORTE RIALZO|RIALZO|NEUTRO|RIBASSO|FORTE RIBASSO)$/.test($('#sentBadge .sent-dir').textContent.trim()),
      'Etichetta di sentiment valida', $('#sentBadge .sent-dir').textContent);
    log($$('#sentReasons li').length >= 4, 'Narrazione di sentiment presente', $$('#sentReasons li').length + ' righe');

    // --- interazioni -------------------------------------------------
    w.alert = function () {};
    w.confirm = function () { return true; };

    // 1. cambio coppia
    var sel = $('#pairSelect');
    sel.value = 'GBP/JPY';
    sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    log($('#chartTitle').textContent === 'GBP/JPY \u00b7 ' + $('#tfSelect').value,
      'Cambio coppia dal selettore', $('#chartTitle').textContent);
    log(parseFloat($('#lastPrice').textContent) > 100, 'Prezzo GBP/JPY plausibile', $('#lastPrice').textContent);

    // 2. cambio timeframe
    var tf = $('#tfSelect');
    tf.value = 'D1';
    tf.dispatchEvent(new w.Event('change', { bubbles: true }));
    log($('#chartTitle').textContent === 'GBP/JPY \u00b7 D1', 'Cambio timeframe', $('#chartTitle').textContent);

    // 3. attivazione livello Bollinger e previsione
    var chips = $$('.chart-toggles .chip');
    chips[1].click(); chips[2].click();
    log(chips[1].classList.contains('active') && chips[2].classList.contains('active'), 'Livelli grafici attivabili');
    log(canvasHasContent($('#chart'), doc), 'Grafico ancora renderizzato dopo i livelli extra');

    // 3b. livelli SMC e premio/sconto
    chips[5].click();
    log(chips[5].classList.contains('active'), 'Livello premio/sconto attivabile');
    log(canvasHasContent($('#chart'), doc), 'Grafico renderizzato con premio/sconto');
    chips[4].click();
    log(!chips[4].classList.contains('active') && canvasHasContent($('#chart'), doc),
      'Overlay SMC disattivabile senza rompere il grafico');
    chips[4].click();
    log(chips[4].classList.contains('active') && canvasHasContent($('#chart'), doc), 'Overlay SMC riattivato');

    // 3c. lo studio di sentiment segue la coppia selezionata
    sel.value = 'USD/JPY';
    sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    log($('#retailPair').textContent === 'USD/JPY', 'Sentiment aggiornato sulla nuova coppia', $('#retailPair').textContent);
    log($$('#strengthList li').length === 10, 'Forza delle valute ricalcolata', $$('#strengthList li').length + ' righe');
    log(/\d/.test($('#smcBias').textContent) && $$('#smcPlan .cell').length === 6,
      'Analisi SMC ricalcolata sulla nuova coppia', $('#smcBias').textContent);
    sel.value = 'EUR/USD';
    sel.dispatchEvent(new w.Event('change', { bubbles: true }));

    // 4. registrazione di un'operazione: cerca un segnale direzionale
    var pairs = $$('#pairSelect option').map(function (o) { return o.value; });
    var found = null;
    for (var i = 0; i < pairs.length && !found; i++) {
      sel.value = pairs[i];
      sel.dispatchEvent(new w.Event('change', { bubbles: true }));
      var d = $('#signalBadge .signal-dir').textContent.trim();
      if (d === 'ACQUISTO' || d === 'VENDITA') found = { pair: pairs[i], dir: d };
    }
    if (!found) {
      log(false, 'Nessun segnale direzionale trovato per testare il registro');
    } else {
      var before = $$('#journalBody tr[data-id]').length;
      $('#saveTradeBtn').click();
      var after = $$('#journalBody tr[data-id]').length;
      log(after === before + 1, 'Registrazione di un trade virtuale', found.pair + ' ' + found.dir + ' (' + before + ' \u2192 ' + after + ')');
      log($('#journalBody tr[data-id] td:nth-child(9)').textContent.trim() === 'APERTO', 'Stato iniziale APERTO');
      $('#journalBody tr[data-id] button.ok').click();
      log($('#journalBody tr[data-id] td:nth-child(9)').textContent.trim() === 'VINTO', 'Chiusura manuale in profitto');
      log(/hit rate 100%/.test($('#journalSummary').textContent), 'Riepilogo del registro aggiornato', $('#journalSummary').textContent.trim());
      $('#journalBody tr[data-id] button.rm').click();
      $('#clearJournal').click();
      log($$('#journalBody tr[data-id]').length === 0, 'Registro svuotato');
    }

    // 5. tasto Aggiorna
    var scoreBefore = $('#signalBadge .signal-conf').textContent;
    var saltBefore = $('#planEntry').textContent;
    $('#refreshBtn').click();
    log(typeof $('#planEntry').textContent === 'string', 'Tasto Aggiorna eseguito senza errori',
      'prezzo ' + saltBefore + ' \u2192 ' + $('#planEntry').textContent);

    // 6. reattività: ridimensionamento della finestra
    w.dispatchEvent(new w.Event('resize'));
    log(canvasHasContent($('#chart'), doc), 'Grafico ridisegnato dopo un resize');

    // 6b. navigazione a tab
    log($$('.tab-panel').length === 6 && $$('#tabbar .tab').length === 6,
      'Sei aree organizzate a tab presenti', $$('#tabbar .tab').map(function (t) { return t.textContent.trim(); }).join(' | '));
    log($('#tab-dash').classList.contains('active') && !$('#tab-grafici').classList.contains('active'),
      'Il dashboard è la tab attiva all\u2019avvio');
    log($$('#dashLadder .h-lab').length >= 4 && $('#dashSpark').width > 0 && $$('#dashEvent .kpi').length >= 1,
      'Cruscotto con scala operativa orizzontale, sparkline e prossimo evento',
      $$('#dashLadder .h-lab').length + ' livelli \u00b7 ' + $$('#dashEvent .kpi').length + ' kpi evento');
    log($$('#indBlock .gauge-tile').length >= 9 && !!$('.ind-detail'),
      'Analisi tecnica: griglia di gauge e dettaglio numerico ripiegato',
      $$('#indBlock .gauge-tile').length + ' tile');
    $$('#tabbar .tab').filter(function (t) { return t.dataset.panel === 'tab-smc'; })[0].click();
    log($('#tab-smc').classList.contains('active') && $$('#liqMap .liq-row').length > 0 &&
      $$('#smcLadder .h-lab').length >= 4 && $$('#structTimeline .ev').length > 0,
      'Il cambio tab mostra il pannello SMC completo',
      $$('#liqMap .liq-row').length + ' livelli \u00b7 ' + $$('#structTimeline .ev').length + ' eventi in finestra');
    log(canvasHasContent($('#chart'), doc), 'Il grafico resta disegnato in tab nascosta');
    $$('#tabbar .tab').filter(function (t) { return t.dataset.panel === 'tab-grafici'; })[0].click();
    log(canvasHasContent($('#chart'), doc), 'Ridisegno del grafico al ritorno nella tab grafici');
    $$('#tabbar .tab').filter(function (t) { return t.dataset.panel === 'tab-dash'; })[0].click();


    // 7. report in linguaggio semplice
    log(!!$('#reportBtn') && !!$('#confReportBtn'), 'Pulsanti di apertura del report presenti');
    log($('#reportOverlay').classList.contains('hidden'), 'Finestra del report chiusa all\u2019avvio');
    $('#reportBtn').click();
    log(!$('#reportOverlay').classList.contains('hidden'), 'Il report si apre con il pulsante della barra');
    var repSections = $$('#reportBody .rep-h2');
    log(repSections.length >= 6, 'Il report contiene tutte le sezioni', repSections.length + ' sezioni');
    log($$('#reportBody .rep-callout').length >= 3, 'Riquadri di sintesi presenti',
      $$('#reportBody .rep-callout').length + ' riquadri');
    log($$('#reportBody .rep-table').length >= 2, 'Tabelle esplicative presenti',
      $$('#reportBody .rep-table').length + ' tabelle');
    log($$('#reportBody .rep-glossary dt').length >= 20, 'Glossario presente nel report',
      $$('#reportBody .rep-glossary dt').length + ' termini spiegati');
    var repText = $('#reportBody').textContent;
    log(repText.length > 4000, 'Report dettagliato', repText.length + ' caratteri');
    log(repText.indexOf('\u2014') === -1, 'Nessun carattere sostitutivo nel testo');
    log(/spiegat[oi] in una riga|ordine alfabetico/.test(repText), 'Il glossario e\u0300 presentato con una spiegazione',
      'testo di introduzione al glossario presente');
    var pairNow = $('#pairSelect').value;
    log($('#reportSubtitle').textContent.indexOf(pairNow) >= 0 &&
      $('#reportSubtitle').textContent.indexOf('orizzonte') >= 0,
      'Sottotitolo con coppia e orizzonte', $('#reportSubtitle').textContent);
    log(!!$('#reportCopy') && !!$('#reportDownload') && !!$('#reportPrint'), 'Azioni di copia, download e stampa presenti');
    $('#reportCopy').click();
    log(true, 'Copia eseguita senza errori');
    $('#reportClose').click();
    log($('#reportOverlay').classList.contains('hidden'), 'Il report si chiude con il pulsante Chiudi');
    $('#confReportBtn').click();
    log(!$('#reportOverlay').classList.contains('hidden'), 'Il report si apre anche dal riquadro di confluenza');
    $('#reportOverlay').click();
    log($('#reportOverlay').classList.contains('hidden'), 'Il report si chiude cliccando lo sfondo');
    // il report segue la coppia selezionata
    sel.value = 'GBP/JPY';
    sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    $('#reportBtn').click();
    log($('#reportSubtitle').textContent.indexOf('GBP/JPY') >= 0 && $$('#reportBody .rep-h2').length >= 6,
      'Il report si rigenera sulla nuova coppia', $('#reportSubtitle').textContent);
    log($('#reportBody').textContent.indexOf('GBP/JPY') >= 0, 'Il testo del report cita la coppia scelta');
    $('#reportClose').click();
    sel.value = 'EUR/USD';
    sel.dispatchEvent(new w.Event('change', { bubbles: true }));

    // 7. nessun errore JS
    var errs = (w.__errors || []);
    log(errs.length === 0, 'Nessun errore JavaScript durante tutto il test', errs.join(' ; '));

    // 8. dati reali dal ponte locale (se il server e\u0300 attivo)
    function getJsonSync(url) {
      var r = new XMLHttpRequest();
      r.open('GET', url, false);
      try { r.send(); } catch (e) { return null; }
      if (r.status !== 200) return null;
      try { return JSON.parse(r.responseText); } catch (e) { return null; }
    }
    var st = getJsonSync('/api/status');
    if (!st) {
      info('SKIP  ponte dati non raggiungibile da questo contesto: controlli sui dati reali saltati');
    } else {
      log(st.ok && st.provider === 'Yahoo Finance', 'Il ponte risponde e dichiara il fornitore', st.provider);
      log((st.enabledSymbols || []).indexOf('EUR/USD') >= 0, 'EUR/USD e\u0300 la coppia collegata ai dati reali');

      var d = getJsonSync('/api/candles?tf=M10&symbol=EUR%2FUSD');
      log(!!d && d.ok === true, 'Scaricamento delle candele reali M10',
        (d && d.ok) ? (d.bars + ' candele \u00b7 ' + String(d.history || '').split(';')[0]) : 'fallito');
      if (d && d.ok) {
        log(d.symbol === 'EUR/USD' && d.source === 'yahoo-finance', 'Il payload dichiara coppia e fonte');
        var cs = d.candles, mono = true, step = -1;
        for (var k = 1; k < cs.length; k++) {
          if (cs[k].time <= cs[k - 1].time) mono = false;
        }
        if (cs.length > 1) step = (cs[1].time - cs[0].time) / 60000;
        log(mono, 'Candele reali in ordine cronologico');
        log(step === 10, 'La candela a 10 minuti ha il passo giusto', step + ' minuti');
        log(cs.length >= 200, 'Serie sufficiente per l\u2019analisi', cs.length + ' candele');
        var lastC = cs[cs.length - 1];
        log(lastC.close > 0 && lastC.high >= Math.max(lastC.open, lastC.close) &&
            lastC.low <= Math.min(lastC.open, lastC.close),
          'OHLC dell\u2019ultima candela coerente', lastC.close);
        log(d.aggregated === true, 'La serie M10 dichiara la ricostruzione dai 5 minuti');

        var second = getJsonSync('/api/candles?tf=M10&symbol=EUR%2FUSD');
        log(!!second && second.fromCache === true, 'La seconda chiamata e\u0300 servita dalla cache del ponte');
      }

      var d1 = getJsonSync('/api/candles?tf=D1&symbol=EUR%2FUSD');
      log(!!d1 && d1.ok === true && d1.bars >= 1200, 'Giornaliero con 5 anni di storia',
        (d1 && d1.ok) ? (d1.bars + ' candele') : 'fallito');
      if (d1 && d1.ok) {
        var spanYears = (d1.candles[d1.candles.length - 1].time - d1.candles[0].time) / (365.25 * 24 * 3600 * 1000);
        log(spanYears >= 4.5, 'La storia giornaliera copre circa 5 anni', spanYears.toFixed(1) + ' anni');
        log((st.timeframes && st.timeframes.D1 && st.timeframes.D1.history) === '5 anni',
          'Il ponte dichiara la profondita\u0300 del giornaliero');
      }
    }

    info('');
    info('Dettagli finali: coppia ' + $('#chartTitle').textContent + ', ultimo prezzo ' + $('#lastPrice').textContent +
      ', segnale ' + $('#signalBadge .signal-dir').textContent.trim() +
      ', confidenza ' + $('#signalBadge .signal-conf').textContent.trim());
    info('Backtest: ' + $$('#btStats .stat').map(function (s) {
      return s.querySelector('.k').textContent + '=' + s.querySelector('.v').textContent;
    }).join(' | '));

    report();
  }
})();
</script>
