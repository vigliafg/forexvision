<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>ForexVision - self check</title>
<style>
  body{background:#0b1017;color:#e6edf7;font:14px/1.5 "JetBrains Mono",monospace;padding:18px;margin:0}
  .pass{color:#18c98a}.fail{color:#f2555a}.info{color:#8fa3bf}
  h1{font-size:18px;color:#63b3ff}
  pre{font:13px/1.55 "JetBrains Mono",monospace;margin:4px 0}
  #summary{font-size:20px;font-weight:700;padding:10px;border-radius:8px;border:1px solid #22304a;background:#141d2b;display:inline-block}
</style>
</head>
<body>
<h1>ForexVision &mdash; verifica automatica dei moduli</h1>
<div id="summary">in esecuzione...</div>
<div id="out"></div>
<script>
  // Raccoglie anche gli errori non gestiti
  var errors = [];
  window.onerror = function (msg, src, line) {
    errors.push(msg + ' @' + String(src || '?').split('/').pop() + ':' + line);
  };
</script>
<script src="../js/data.js"></script>
<script src="../js/indicators.js"></script>
<script src="../js/forecast.js"></script>
<script src="../js/smc.js"></script>
<script src="../js/divergence.js"></script>
<script src="../js/sentiment.js"></script>
<script src="../js/feed.js"></script>
<script src="../js/report.js"></script>
<script src="../js/help.js"></script>
<script src="expected.js"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var reportLines = [];
  var pass = 0, fail = 0;
  function log(ok, label, extra) {
    ok ? pass++ : fail++;
    var p = document.createElement('pre');
    p.className = ok ? 'pass' : 'fail';
    p.textContent = (ok ? 'PASS  ' : 'FAIL  ') + label + (extra ? '   |  ' + extra : '');
    out.appendChild(p);
    reportLines.push(p.textContent);
  }
  function info(txt) {
    var p = document.createElement('pre');
    p.className = 'info';
    p.textContent = txt;
    out.appendChild(p);
    reportLines.push(txt);
  }
  function isFiniteArr(arr) {
    var bad = 0;
    arr.forEach(function (v) { if (v != null && !isFinite(v)) bad++; });
    return bad;
  }

  var D = window.ForexData, I = window.Indicators, F = window.Forecast;

  try {

  // ---------- 1. indicatori su serie nota ----------
  var flat = new Array(60).fill(5);
  var smaFlat = I.sma(flat, 10), emaFlat = I.ema(flat, 10), rsiFlat = I.rsi(flat, 14);
  log(smaFlat[59] === 5 && emaFlat[59] === 5, 'SMA/EMA su serie costante = 5', 'sma=' + smaFlat[59] + ' ema=' + emaFlat[59]);
  log(rsiFlat[59] === 0 || rsiFlat[59] === 100 || rsiFlat[59] === null || isFinite(rsiFlat[59]), 'RSI su serie piatta non produce NaN', 'rsi=' + rsiFlat[59]);

  var rising = [];
  for (var i = 0; i < 80; i++) rising.push(1 + i * 0.01);
  var rsiUp = I.rsi(rising, 14);
  log(rsiUp[79] > 95, 'RSI su serie monotona crescente ~ 100', 'rsi=' + rsiUp[79].toFixed(2));
  var mac = I.macd(rising, 12, 26, 9);
  log(Math.abs(mac.histogram[79] - (mac.macd[79] - mac.signal[79])) < 1e-12, 'MACD: istogramma = linea - segnale');
  var bb = I.bollinger(flat, 20, 2);
  log(bb.upper[59] === 5 && bb.lower[59] === 5, 'Bollinger su serie piatta: bande coincidenti', '%B=' + bb.percentB[59]);
  var atrC = [];
  for (var k = 0; k < 40; k++) atrC.push({ open: 1, high: 1.002, low: 0.998, close: 1, volume: 100 });
  var atrArr = I.atr(atrC.map(function (c) { return c.high; }), atrC.map(function (c) { return c.low; }), atrC.map(function (c) { return c.close; }), 14);
  log(Math.abs(atrArr[39] - 0.004) < 1e-9, 'ATR su candele di ampiezza fissa 40 pip', 'atr=' + atrArr[39]);

  // ---------- 1b. indicatori di trend e di inversione ----------
  // serie monotona crescente e serie oscillatoria: le due letture opposte
  var upC = [], upH = [], upL = [], oscC = [], oscH = [], oscL = [];
  for (var ti = 0; ti < 160; ti++) {
    var tv = 1 + ti * 0.002;
    upC.push(tv); upH.push(tv + 0.0006); upL.push(tv - 0.0006);
  }
  for (var oi = 0; oi < 200; oi++) {
    var ov = 1 + 0.001 * Math.sin(oi);
    oscC.push(ov); oscH.push(ov + 0.0012); oscL.push(ov - 0.0012);
  }

  var stArr = I.supertrend(upH, upL, upC, 10, 3);
  log(stArr.dir[159] === 1 && stArr.line[159] <= upC[159],
    'SuperTrend: in un trend rialzista la linea sta sotto il prezzo (sostegno)',
    'linea=' + stArr.line[159].toFixed(5) + ' dir=' + stArr.dir[159]);
  var psArr = I.psar(upH, upL, 0.02, 0.2);
  log(psArr[159] < upC[159], 'Parabolic SAR sotto il prezzo in un trend rialzista', 'sar=' + psArr[159].toFixed(5));
  log(isFiniteArr(psArr) === 0, 'Parabolic SAR senza NaN');

  var arArr = I.aroon(upH, upL, 25);
  log(arArr.up[159] === 100 && arArr.down[159] === 0,
    'Aroon: in una serie sempre crescente il massimo e il minimo piu' + ' recenti sono opposti',
    'up=' + arArr.up[159] + ' down=' + arArr.down[159]);

  var vxArr = I.vortex(upH, upL, upC, 14);
  log(vxArr.plus[159] > vxArr.minus[159] && vxArr.plus[159] > 1,
    'Vortex: VI+ sopra VI- e sopra 1 in un trend rialzista',
    'VI+=' + vxArr.plus[159].toFixed(2) + ' VI-=' + vxArr.minus[159].toFixed(2));

  var dmArr = I.dmi(upH, upL, upC, 14);
  log(dmArr.adx[159] === I.adx(upH, upL, upC, 14)[159] && dmArr.plusDI[159] > dmArr.minusDI[159],
    'DMI: +DI sopra -DI nel rialzo e ADX invariato dopo il refactoring',
    '+DI=' + dmArr.plusDI[159].toFixed(1) + ' -DI=' + dmArr.minusDI[159].toFixed(1) +
    ' ADX=' + dmArr.adx[159].toFixed(1));
  log(isFiniteArr(I.adxr(dmArr.adx, 14)) === 0, 'ADXR calcolato senza NaN');

  var cciArr = I.cci(upH, upL, upC, 20);
  log(cciArr[159] > 100, 'CCI oltre +100 in una serie in salita', 'cci=' + cciArr[159].toFixed(1));
  log(isFiniteArr(I.cci(oscH, oscL, oscC, 20)) === 0, 'CCI senza NaN su una serie oscillante');

  var srArr = I.stochRsi(oscC, 14, 14, 3, 3);
  var srVals = srArr.k.slice(150, 200).filter(function (v) { return v != null; });
  var srOk = srVals.length > 10 && srVals.every(function (v) { return v >= 0 && v <= 100; });
  var srSpread = srOk && srVals.length > 1 ? Math.max.apply(null, srVals) - Math.min.apply(null, srVals) : 0;
  log(srOk && srSpread > 5, 'Stochastic RSI nell\u2019intervallo 0-100 e oscillante',
    'min/max K = ' + (srOk ? Math.min.apply(null, srVals).toFixed(1) + '/' + Math.max.apply(null, srVals).toFixed(1) : 'n.d.'));

  var chopUp = I.choppiness(upH, upL, upC, 14), chopOsc = I.choppiness(oscH, oscL, oscC, 14);
  log(chopUp[159] < 38 && chopOsc[159] > 55,
    'Choppiness Index: basso sul trend, alto sul laterale',
    'trend=' + chopUp[159].toFixed(1) + ' laterale=' + chopOsc[159].toFixed(1));

  var kcArr = I.keltner(upH, upL, upC, 20, 10, 2);
  log(kcArr.upper[159] > kcArr.middle[159] && kcArr.middle[159] > kcArr.lower[159],
    'Keltner: banda superiore, media e inferiore in ordine',
    kcArr.lower[159].toFixed(5) + ' < ' + kcArr.middle[159].toFixed(5) + ' < ' + kcArr.upper[159].toFixed(5));

  var ichArr = I.ichimoku(upH, upL, upC, 9, 26, 52);
  log(ichArr.spanA[159] != null && ichArr.spanB[159] != null && ichArr.kijun[159] <= upC[159],
    'Ichimoku: nuvola disponibile e prezzo sopra la linea base',
    'kijun=' + ichArr.kijun[159].toFixed(5) + ' spanA=' + ichArr.spanA[159].toFixed(5));
  log(ichArr.spanA[40] == null && ichArr.spanB[70] == null && ichArr.spanA[51] != null,
    'Ichimoku: la nuvola compare solo a warm-up completo (nessun look-ahead)',
    'spanA[40]=' + ichArr.spanA[40] + ' spanB[70]=' + ichArr.spanB[70] + ' spanA[51]=' + (ichArr.spanA[51] != null ? 'ok' : 'null'));

  // ---------- 1c. divergenze prezzo / oscillatori ----------
  var DIV = window.Divergence;
  log(!!DIV && typeof DIV.analyze === 'function', 'Modulo divergenze caricato');
  // serie a doppio minimo: il secondo e' piu' basso ma con RSI piu' alto
  var dvPts = [], dvv = 1.1;
  for (var w = 0; w < 20; w++) { dvv += (w % 2 ? -0.0006 : 0.0006); dvPts.push(dvv); }
  for (var w1 = 0; w1 < 7; w1++) { dvv -= 0.0012; dvPts.push(dvv); }
  for (var w2 = 0; w2 < 6; w2++) { dvv += 0.0009; dvPts.push(dvv); }
  for (var w3 = 0; w3 < 16; w3++) { dvv += (w3 % 3 === 2 ? 0.0004 : -0.0007); dvPts.push(dvv); }
  for (var w4 = 0; w4 < 8; w4++) { dvv += 0.0003; dvPts.push(dvv); }
  var dvCandles = dvPts.map(function (c, k) {
    return { time: Date.UTC(2026, 8, 1) + k * 3600000, open: c, high: c + 0.0004, low: c - 0.0004, close: c, volume: 100 };
  });
  var dvInd = I.computeAll(dvCandles);
  var dvRes = DIV.analyze(dvCandles, dvInd, D.instrumentBySymbol('EUR/USD'), { atr: I.last(dvInd.atr) });
  var dvBull = dvRes.items.filter(function (it) { return it.osc === 'RSI' && it.dir > 0 && it.kind === 'regular'; })[0];
  log(!!dvBull && dvBull.to.price < dvBull.from.price && dvBull.to.osc > dvBull.from.osc,
    'Divergenza regolare rialzista: minimo piu\u2019 basso con RSI piu\u2019 alto',
    dvBull ? ('prezzo ' + dvBull.from.price.toFixed(5) + ' \u2192 ' + dvBull.to.price.toFixed(5) +
      ' \u00b7 RSI ' + dvBull.from.osc.toFixed(1) + ' \u2192 ' + dvBull.to.osc.toFixed(1)) : 'non rilevata');
  log(dvRes.score > 0 && dvRes.score <= 1, 'La divergenza rialzista produce un punteggio positivo',
    'score=' + dvRes.score.toFixed(2));

  // ogni voce rispettata la propria definizione, ordine e causalita'
  var dvDef = 0, dvOrder = 0, dvCausal = 0, dvSide = 0;
  dvRes.items.forEach(function (it, k) {
    var dPrice = it.to.price - it.from.price, dOsc = it.to.osc - it.from.osc;
    if (it.kind === 'regular') {
      if (!((it.side === 'low' && dPrice < 0 && dOsc > 0) || (it.side === 'high' && dPrice > 0 && dOsc < 0))) dvDef++;
    } else if (!((it.side === 'low' && dPrice > 0 && dOsc < 0) || (it.side === 'high' && dPrice < 0 && dOsc > 0))) dvDef++;
    if (it.dir !== (it.side === 'low' ? 1 : -1)) dvSide++;
    if (k > 0 && dvRes.items[k - 1].index < it.index) dvOrder++;
    if (it.to.index + 3 > dvCandles.length - 1) dvCausal++;
  });
  log(dvDef === 0 && dvSide === 0, 'Ogni divergenza rispetta la definizione e il verso del lato',
    'voci=' + dvRes.items.length + ' \u00b7 violazioni=' + (dvDef + dvSide));
  log(dvOrder === 0, 'Divergenze ordinate dalla piu\u2019 recente');
  log(dvCausal === 0, 'Divergenze solo su swing gia\u2019 confermati (nessun look-ahead)',
    'voci=' + dvRes.items.length);
  var dvAgain = DIV.analyze(dvCandles, dvInd, D.instrumentBySymbol('EUR/USD'), { atr: I.last(dvInd.atr) });
  log(dvAgain.items.length === dvRes.items.length && dvAgain.score === dvRes.score,
    'Rilevatore di divergenze deterministico a parita\u2019 di dati');
  log(dvRes.items.length === 0 || dvRes.items.every(function (it) { return isFinite(it.score); }),
    'Punteggi delle divergenze finiti');

  // ---------- 1c-bis. studio di efficacia delle divergenze ----------
  // Lo studio cammina la serie e misura l'esito successivo di ogni divergenza:
  // quante volte il movimento e' andato nel verso del segnale e di quanto, in
  // multipli di ATR. Qui si verificano causalita', coerenza statistica e
  // prudenza del verdetto.
  var stInst = D.instrumentBySymbol('EUR/USD');
  var stCandles = D.generateSeries('EUR/USD', 'H1', 0).candles;
  var stInd = I.computeAll(stCandles);
  var stSmc = window.SMC.analyze(stCandles, stInd, stInst);
  var stOpts = { horizon: 10, window: 300, swings: stSmc.swings, atr: I.last(stInd.atr) };
  var stStudy = DIV.backtest(stCandles, stInd, stInst, stOpts);
  log(!!stStudy && stStudy.count > 0, 'Studio di efficacia: casi misurati sulla serie',
    'casi=' + stStudy.count + ' su ' + stStudy.window + ' barre, esito a ' + stStudy.horizon + ' barre');
  var stEntry = 0, stCausal = 0, stBadR = 0, stBadWin = 0, stBadDir = 0;
  stStudy.trades.forEach(function (t) {
    if (t.entryIdx !== t.index + 3) stEntry++;
    if (!(t.entryIdx > t.index && t.entryIdx + stStudy.horizon < stCandles.length)) stCausal++;
    if (t.dir !== (t.side === 'low' ? 1 : -1)) stBadDir++;
    var unit = stInd.atr[t.entryIdx];
    var r = ((stCandles[t.entryIdx + stStudy.horizon].close - stCandles[t.entryIdx].close) * t.dir) / unit;
    if (Math.abs(r - t.r) > 1e-9) stBadR++;
    if (t.win !== (t.r > 0)) stBadWin++;
  });
  log(stEntry === 0, 'Studio: l\u2019esito parte alla barra di conferma dello swing (3 barre dopo)',
    'casi=' + stStudy.trades.length);
  log(stCausal === 0, 'Studio: nessun caso usa dati futuri rispetto alla propria entrata');
  log(stBadDir === 0 && stBadWin === 0, 'Studio: esito coerente con il verso del segnale');
  log(stBadR === 0, 'Studio: ogni esito normalizzato con l\u2019ATR del momento del segnale, non con quello finale',
    'violazioni=' + stBadR);
  var stR = stStudy.trades.map(function (t) { return t.r; });
  var stWins = stStudy.trades.filter(function (t) { return t.win; }).length;
  var stMean = stR.reduce(function (a, v) { return a + v; }, 0) / stR.length;
  var stSd = Math.sqrt(stR.reduce(function (a, v) { return a + (v - stMean) * (v - stMean); }, 0) / (stR.length - 1));
  var stAll = stStudy.all;
  log(stAll.count === stR.length && Math.abs(stAll.hitRate - stWins / stR.length) < 1e-12,
    'Studio: tasso di successo coerente con i casi misurati', (stAll.hitRate * 100).toFixed(1) + '%');
  log(stAll.count > 1 && Math.abs(stAll.avgR - stMean) < 1e-12 &&
    Math.abs(stAll.ci95 - 1.96 * stSd / Math.sqrt(stR.length)) < 1e-12,
    'Studio: media e intervallo di confidenza al 95% calcolati sugli esiti',
    'R=' + stAll.avgR.toFixed(3) + ' \u00b1 ' + stAll.ci95.toFixed(3));
  log(stAll.significant === (stAll.avgR - stAll.ci95 > 0),
    'Studio: il vantaggio e\u2019 dichiarato solo se supera l\u2019incertezza statistica',
    'significativo=' + stAll.significant);
  var stPf = stAll.profitFactor;
  log(stAll.count === 0 || (isFinite(stPf) ? stPf >= 0 : stPf === Infinity),
    'Studio: profit factor non negativo', String(stPf).slice(0, 6));
  log(stStudy.byKind.regular.count + stStudy.byKind.hidden.count === stStudy.count,
    'Studio: regolari e nascoste coprono tutti i casi',
    stStudy.byKind.regular.count + ' + ' + stStudy.byKind.hidden.count + ' = ' + stStudy.count);
  var stOscKeys = Object.keys(stStudy.byOsc);
  log(stOscKeys.length >= 2 && stOscKeys.every(function (k) { return stStudy.byOsc[k].count <= stStudy.count; }) &&
    stOscKeys.indexOf('RSI') >= 0 && stOscKeys.indexOf('MACD') >= 0,
    'Studio: ripartizione per oscillatore presente', stOscKeys.join(', '));
  var stAgain = DIV.backtest(stCandles, stInd, stInst, stOpts);
  log(stAgain.count === stStudy.count && stAgain.all.avgR === stStudy.all.avgR &&
    stAgain.all.ci95 === stStudy.all.ci95,
    'Studio: risultato e statistiche riproducibili a parita\u2019 di dati');
  var stEmpty = DIV.backtest(stCandles.slice(0, 8), stInd, stInst, {});
  log(stEmpty.count === 0 && stEmpty.all.count === 0 && stEmpty.all.ci95 === 0,
    'Studio: serie troppo corta gestita senza errori (nessun caso)');
  // il verdetto sintetico non promette piu' di quanto i numeri dicano
  var stFlat = DIV.verdictOf({ count: 100, avgR: 0.05, ci95: 0.20, significant: false });
  var stPos = DIV.verdictOf({ count: 100, avgR: 0.30, ci95: 0.05, significant: true });
  var stNeg = DIV.verdictOf({ count: 100, avgR: -0.30, ci95: 0.05, significant: false });
  log(stFlat.level === 'flat' && /zero/.test(stFlat.text),
    'Verdetto prudente quando l\u2019intervallo di confidenza contiene lo zero', stFlat.text);
  log(stPos.level === 'pos' && stNeg.level === 'neg',
    'Verdetto positivo solo con margine oltre l\u2019incertezza, negativo quando l\u2019esito medio e\u2019 in perdita',
    stPos.text + ' \u00b7 ' + stNeg.text);
  log(DIV.verdictOf({ count: 0 }).level === 'flat' &&
    DIV.verdictOf(null).level === 'flat',
    'Verdetto senza campionamento non dichiara alcun vantaggio');

  // ---------- 1d. pivot point ----------
  var pvCandles = [], pvp = 1.1;
  for (var q = 0; q < 96; q++) {
    pvp += 0.0004 * Math.sin(q / 6);
    pvCandles.push({ time: Date.UTC(2026, 8, 1) + q * 3600000, open: pvp, high: pvp + 0.0009, low: pvp - 0.0009, close: pvp + 0.0002, volume: 100 });
  }
  function pvKeySame(a, b) {
    return a && b && Math.abs(a.high - b.high) < 1e-12 &&
      Math.abs(a.low - b.low) < 1e-12 && Math.abs(a.close - b.close) < 1e-12;
  }
  var pv = I.pivotPoints(pvCandles, 60);
  var pc = pv.classic;
  log(!!pv && pc.r3 > pc.r2 && pc.r2 > pc.r1 && pc.r1 > pc.p && pc.p > pc.s1 && pc.s1 > pc.s2 && pc.s2 > pc.s3,
    'Pivot classici in ordine R3 > R2 > R1 > P > S1 > S2 > S3');
  log(pv.camarilla.r4 > pv.camarilla.r3 && pv.camarilla.r3 > pv.camarilla.r2 &&
    pv.camarilla.r2 > pv.camarilla.r1 && pv.camarilla.s1 > pv.camarilla.s2 && pv.camarilla.s2 > pv.camarilla.s3,
    'Pivot Camarilla in ordine');
  log(Math.abs(pc.p - (pv.high + pv.low + pv.close) / 3) < 1e-12,
    'Il pivot centrale e\u0300 la media di massimo, minimo e chiusura del periodo precedente',
    'P=' + pc.p.toFixed(5));
  // i pivot devono venire dall'ultimo periodo CHIUSO: si ricalcolano qui
  // massimo, minimo e chiusura di quel periodo e si confrontano
  var pvKeys = [], pvAgg = {};
  pvCandles.forEach(function (c) {
    var kk = I.periodKey(c.time, 60);
    if (pvKeys[pvKeys.length - 1] !== kk) pvKeys.push(kk);
    if (!pvAgg[kk]) pvAgg[kk] = { high: c.high, low: c.low, close: c.close };
    else {
      if (c.high > pvAgg[kk].high) pvAgg[kk].high = c.high;
      if (c.low < pvAgg[kk].low) pvAgg[kk].low = c.low;
      pvAgg[kk].close = c.close;
    }
  });
  var pvPrev = pvKeys[pvKeys.length - 2];
  log(pvKeys.length >= 2 && pv.period === pvPrev && pvKeySame(pv, pvAgg[pvPrev]),
    'Pivot calcolati sull\u2019ultimo periodo chiuso (quello in corso e\u0300 escluso)',
    'periodo=' + pv.period + ' su ' + pvKeys.length + ' periodi');
  log(I.pivotPoints(pvCandles.slice(0, 2), 60) === null, 'Pivot non calcolabili su una serie troppo corta');

  var lrUp = I.linreg(upC, 50), lrOsc = I.linreg(oscC, 50);
  log(lrUp.r2[159] > 0.99 && lrUp.slope[159] > 0, 'Regressione: R2 ~ 1 e pendenza positiva su una retta',
    'R2=' + lrUp.r2[159].toFixed(4));
  log(lrOsc.r2[159] < 0.5, 'Regressione: R2 basso su una serie che oscilla', 'R2=' + lrOsc.r2[159].toFixed(3));

  // ---------- 1e. spiegazioni delle card (js/help.js) ----------
  // Ogni card deve saper spiegare se stessa: testo generale e lettura dei dati
  // presenti. Le spiegazioni vengono provate sia senza dati (prima analisi,
  // ponte non raggiungibile) sia con un contesto completo: in nessuno dei due
  // casi devono andare in errore o stampare valori senza senso.
  var CH = window.CardHelp;
  log(!!CH && typeof CH.explain === 'function' && typeof CH.has === 'function',
    'Modulo delle spiegazioni caricato');
  var chKeys = CH.keys();
  log(chKeys.length >= 19, 'Una spiegazione per ogni card e ogni grafico',
    'spiegazioni = ' + chKeys.length + ' (' + chKeys.slice(0, 5).join(', ') + ' ...)');
  var chBad = [], chThin = [];
  chKeys.forEach(function (k) {
    var e = CH.EXPLAIN[k];
    if (!e || typeof e.title !== 'string' || !e.title.trim()) chBad.push(k + ':titolo');
    if (!Array.isArray(e.general) || e.general.length < 1 ||
      !e.general.every(function (t) { return typeof t === 'string' && t.trim().length > 40; })) chBad.push(k + ':generale');
    if (!Array.isArray(e.reading) || e.reading.length < 2) chBad.push(k + ':lettura');
    if (typeof e.now !== 'function') chBad.push(k + ':dati');
    if (e && e.general && e.general.join(' ').length < 150) chThin.push(k);
  });
  log(chBad.length === 0, 'Ogni spiegazione ha titolo, testo generale, lettura e parte sui dati',
    'problemi = ' + (chBad.join(', ') || 'nessuno'));
  log(chThin.length === 0, 'Il testo generale di ogni card e\u2019 sostanzioso, non una riga vuota',

  log(pipsH1 > 7 && pipsH1 < 22, 'ATR EUR/USD H1 realistico (7-22 pip)', pipsH1.toFixed(1) + ' pip');
  var pipsD1 = meanAtrPct('EUR/USD', 'H1', CAL_SEEDS) * Math.sqrt(24) / 100 * eur.base / D.pipSize(eur);
  log(pipsD1 > 45 && pipsD1 < 100, 'ATR EUR/USD giornaliero realistico (45-100 pip)', pipsD1.toFixed(1) + ' pip');
  var gold = D.instrumentBySymbol('XAU/USD');
  var goldPips = meanAtrPct('XAU/USD', 'H1', CAL_SEEDS) / 100 * gold.base / D.pipSize(gold);
  log(goldPips > 200 && goldPips < 800, 'ATR oro H1 coerente (2-8 USD per barra)', (goldPips / 100).toFixed(2) + ' USD');
  // confronto a tolleranza: Math.pow(10,-4) differisce dal letterale 0.0001
  // per un ulp (1,4e-20), quindi il confronto esatto fallirebbe a torto
  log(Math.abs(D.pipSize(eur) - 0.0001) < 1e-12 && Math.abs(D.pipSize(D.instrumentBySymbol('USD/JPY')) - 0.01) < 1e-12,
    'Dimensione del pip corretta (0,0001 per EUR/USD, 0,01 per USD/JPY)',
    'pip EUR/USD=' + D.pipSize(eur) + ' pip USD/JPY=' + D.pipSize(D.instrumentBySymbol('USD/JPY')));

  // ---------- 7. Smart Money Concepts ----------
  var SMC = window.SMC, SEN = window.Sentiment;
  var smcCandles = D.generateSeries('EUR/USD', 'H1', 0).candles;
  var smcInst = D.instrumentBySymbol('EUR/USD');
  var smcInd = I.computeAll(smcCandles);
  var smc = SMC.analyze(smcCandles, smcInd, smcInst);
  var LB = 3;

  log(!!SMC && !!SEN, 'Moduli SMC e sentiment caricati');

  // swing: ogni swing e' l'estremo effettivo della propria finestra e la
  // conferma arriva esattamente a lookback barre di distanza
  var swingList = SMC.findSwings(smcCandles, LB);
  var swingBad = 0;
  swingList.forEach(function (s) {
    if (s.confirmedAt !== s.index + LB) swingBad++;
    for (var j = s.index - LB; j <= s.index + LB; j++) {
      if (j === s.index) continue;
      if (s.kind === 'high' && smcCandles[j].high > s.price) swingBad++;
      if (s.kind === 'low' && smcCandles[j].low < s.price) swingBad++;
    }
  });
  log(swingBad === 0 && swingList.length > 20, 'Swing point validi e confermati correttamente',
    swingList.length + ' swing, violazioni=' + swingBad);

  // struttura: nessun look-ahead e livelli realmente superati in chiusura
  var evCloseBad = 0, evOrderBad = 0, evLevelBad = 0;
  smc.structure.events.forEach(function (e) {
    var c = smcCandles[e.index];
    if (e.dir === 1 && !(c.close > e.level)) evCloseBad++;
    if (e.dir === -1 && !(c.close < e.level)) evCloseBad++;
    if (!(e.swingIndex < e.index) || e.swingConfirmedAt > e.index) evOrderBad++;
    var match = swingList.some(function (s) {
      return s.index === e.swingIndex && Math.abs(s.price - e.level) < 1e-12 && s.kind === (e.dir === 1 ? 'high' : 'low');
    });
    if (!match) evLevelBad++;
  });
  log(evCloseBad === 0, 'BOS/CHoCH: la chiusura supera davvero il livello rotto',
    smc.structure.events.length + ' eventi, violazioni=' + evCloseBad);
  log(evOrderBad === 0, 'Nessun look-ahead: ogni evento usa solo swing gia\u0300 confermati');
  log(evLevelBad === 0, 'Il livello rotto coincide con uno swing confermato');

  // order block: geometria, colore della candela e stato coerente col prezzo
  var obBad = 0;
  smc.orderBlocks.forEach(function (z) {
    if (!(z.top >= z.bottom)) obBad++;
    if (!(z.formedAt <= z.eventIndex)) obBad++;
    var c = smcCandles[z.formedAt];
    if (z.kind === 'bullish' && !(c.close < c.open)) obBad++;
    if (z.kind === 'bearish' && !(c.close > c.open)) obBad++;
    for (var k = z.formedAt + 1; k < smcCandles.length; k++) {
      var b = smcCandles[k];
      if (z.kind === 'bullish') {
        if (b.close < z.bottom) { if (z.status !== 'invalidated') obBad++; break; }
        if (b.low <= z.top && z.status === 'fresh') obBad++;
      } else {
        if (b.close > z.top) { if (z.status !== 'invalidated') obBad++; break; }
        if (b.high >= z.bottom && z.status === 'fresh') obBad++;
      }
    }
  });
  log(obBad === 0 && smc.orderBlocks.length > 0, 'Order block: geometria e stato coerenti con i prezzi successivi',
    smc.orderBlocks.length + ' OB, violazioni=' + obBad);

  // fair value gap: verifica diretta sui tre candeloni
  var fvgBad = 0;
  smc.fvgs.forEach(function (z) {
    var a = smcCandles[z.formedAt - 2], c = smcCandles[z.formedAt];
    if (!(z.top > z.bottom)) fvgBad++;
    if (z.kind === 'bullish' && !(c.low > a.high)) fvgBad++;
    if (z.kind === 'bearish' && !(a.low > c.high)) fvgBad++;
    var size = z.kind === 'bullish' ? c.low - a.high : a.low - c.high;
    if (Math.abs(size - z.size) > 1e-9) fvgBad++;
  });
  log(fvgBad === 0 && smc.fvgs.length > 0, 'Fair value gap coerenti con i tre candeloni di origine',
    smc.fvgs.length + ' FVG, violazioni=' + fvgBad);

  // liquidita': almeno due estremi per pool e sweep verificati sui prezzi
  var liqBad = 0;
  smc.liquidity.forEach(function (l) {
    if (l.members < 2) liqBad++;
    if (l.sweptAt != null) {
      var c = smcCandles[l.sweptAt];
      if (l.kind === 'buy-side' && !(c.high > l.price && c.close < l.price)) liqBad++;
      if (l.kind === 'sell-side' && !(c.low < l.price && c.close > l.price)) liqBad++;
    }
    if (l.taken && l.sweptAt == null) {
      var ok = false;
      for (var k = l.confirmedAt; k < smcCandles.length; k++) {
        if (l.kind === 'buy-side' ? smcCandles[k].high > l.price : smcCandles[k].low < l.price) ok = true;
      }
      if (!ok) liqBad++;
    }
  });
  log(liqBad === 0, 'Pool di liquidita\u0300 e sweep verificati sui prezzi',
    smc.liquidity.length + ' pool, violazioni=' + liqBad);

  // range di riferimento, premio/sconto e OTE
  var rghi = -Infinity, rglo = Infinity;
  for (var ri = smc.range.start; ri < smcCandles.length; ri++) {
    if (smcCandles[ri].high > rghi) rghi = smcCandles[ri].high;
    if (smcCandles[ri].low < rglo) rglo = smcCandles[ri].low;
  }
  var r = smc.range;
  var rangeOk = r.high >= r.low &&
    Math.abs(rghi - r.high) < 1e-12 && Math.abs(rglo - r.low) < 1e-12 &&
    r.equilibrium >= r.low && r.equilibrium <= r.high &&
    r.ote.top <= r.high + 1e-12 && r.ote.bottom >= r.low - 1e-12 &&
    r.position > -0.6 && r.position < 1.6;
  log(rangeOk, 'Range, equilibrio e OTE coerenti con i prezzi',
    r.low.toFixed(5) + ' - ' + r.high.toFixed(5) + ' \u00b7 posizione ' + (r.position * 100).toFixed(0) + '%');

  // punteggio e scenario operativo
  log(smc.components.length === 6 && smc.score >= -1 && smc.score <= 1,
    'Sei componenti SMC con punteggio in [-1,1]', 'score=' + smc.score.toFixed(3));
  var p = smc.plan;
  var planOk = p.direction === 1
    ? (p.stop < p.marketEntry && p.tp2 > p.marketEntry)
    : (p.stop > p.marketEntry && p.tp2 < p.marketEntry);
  log(planOk, 'Scenario SMC coerente: stop e target ai lati corretti del prezzo',
    (p.direction === 1 ? 'long' : 'short') + ' entry ' + p.marketEntry.toFixed(5) +
    ' stop ' + p.stop.toFixed(5) + ' tp2 ' + p.tp2.toFixed(5));
  var entrySideOk = p.direction === 1
    ? (p.limitEntry <= p.marketEntry + 1e-12 && p.tp1 >= p.marketEntry)
    : (p.limitEntry >= p.marketEntry - 1e-12 && p.tp1 <= p.marketEntry);
  log(entrySideOk, 'Ingresso limite e primo obiettivo dal lato corretto rispetto al prezzo',
    'limite ' + p.limitEntry.toFixed(5) + ' \u00b7 tp1 ' + p.tp1.toFixed(5) +
    ' \u00b7 prezzo ' + p.marketEntry.toFixed(5) + ' (' + (p.direction === 1 ? 'long' : 'short') + ')');
  log(p.rr > 0 && isFinite(p.rr), 'Rapporto rischio/rendimento SMC calcolato', 'R:R=' + p.rr.toFixed(2));
  log(smc.reasons.length >= 4, 'Narrazione SMC generata', 'righe=' + smc.reasons.length);

  // determinismo del motore
  var smc2 = SMC.analyze(smcCandles, smcInd, smcInst);
  log(smc2.score === smc.score && smc2.orderBlocks.length === smc.orderBlocks.length &&
    smc2.structure.events.length === smc.structure.events.length,
    'Analisi SMC deterministica a parita\u0300 di dati');

  // ---------- 8. Sentiment ----------
  var cache = D.INSTRUMENTS.map(function (inst) {
    var c = D.generateSeries(inst.symbol, 'H1', 0).candles;
    return { symbol: inst.symbol, instrument: inst, candles: c, ind: I.computeAll(c) };
  });
  var sen = SEN.analyze(cache, 'EUR/USD', smcInst);

  log(sen.strength.list.length === 10, 'Forza calcolata per tutte le 10 divise',
    sen.strength.list.map(function (x) { return x.currency; }).slice(0, 4).join(',') + '\u2026');
  log(sen.strength.list.every(function (x) { return x.score >= 0 && x.score <= 100; }),
    'Punteggi di forza normalizzati in 0-100',
    'prima=' + sen.strength.list[0].currency + ' ' + sen.strength.list[0].score.toFixed(0));
  log(sen.strength.list[0].score >= sen.strength.list[9].score && sen.strength.list[0].rank === 1,
    'Classifica delle divise ordinata per punteggio');

  // variabili di riferimento usate dai controlli di coerenza
  var med = 20, li = cache[0].candles.length - 1;
  var rocPair = (cache[0].candles[li].close - cache[0].candles[li - med].close) / cache[0].candles[li - med].close;
  var diffStr = sen.strength.byCurrency.EUR.medium - sen.strength.byCurrency.USD.medium;

  // proprieta' esatta: la forza grezza di una divisa e' la media dei rendimenti
  // firmati di tutte le coppie in cui compare
  var rawBad = 0, rawChecked = 0;
  ['EUR', 'USD', 'JPY', 'XAU'].forEach(function (cur) {
    var acc = [], w = 20;
    D.INSTRUMENTS.forEach(function (inst) {
      var p = inst.symbol.split('/');
      if (p[0] !== cur && p[1] !== cur) return;
      var c = D.generateSeries(inst.symbol, 'H1', 0).candles;
      var i = c.length - 1;
      var roc = (c[i].close - c[i - w].close) / c[i - w].close;
      acc.push(p[0] === cur ? roc : -roc);
    });
    var mean = acc.reduce(function (x, y) { return x + y; }, 0) / acc.length * 100;
    if (Math.abs(mean - sen.strength.byCurrency[cur].medium) > 1e-9) rawBad++;
    rawChecked++;
  });
  log(rawBad === 0 && rawChecked === 4,
    'Forza grezza = media dei rendimenti firmati delle coppie della divisa',
    rawChecked + ' divise verificate, violazioni=' + rawBad);

  // con una sola coppia in osservazione la forza relativa deve rispecchiare
  // esattamente il movimento del cambio (segno incluso)
  var soloCache = [{ symbol: 'EUR/USD', instrument: smcInst, candles: cache[0].candles, ind: cache[0].ind }];
  var senSolo = SEN.analyze(soloCache, 'EUR/USD', smcInst);
  var dSolo = senSolo.strength.byCurrency.EUR.medium - senSolo.strength.byCurrency.USD.medium;
  log(Math.sign(dSolo) === Math.sign(rocPair),
    'Con una sola coppia la forza relativa segue il segno del cambio',
    'differenziale ' + dSolo.toFixed(1) + ' vs cambio ' + (rocPair * 100).toFixed(3) + '%');

  // sull'intero paniere il differenziale deve concordare con la media dei
  // rendimenti delle coppie della divisa base meno quelle della quotata
  var accEur = [], accUsd = [];
  D.INSTRUMENTS.forEach(function (inst) {
    var p = inst.symbol.split('/');
    var c = D.generateSeries(inst.symbol, 'H1', 0).candles;
    var i = c.length - 1;
    var roc = (c[i].close - c[i - 20].close) / c[i - 20].close;
    if (p[0] === 'EUR') accEur.push(roc);
    if (p[1] === 'EUR') accEur.push(-roc);
    if (p[0] === 'USD') accUsd.push(roc);
    if (p[1] === 'USD') accUsd.push(-roc);
  });
  function meanOf(a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; }
  var expected = (meanOf(accEur) - meanOf(accUsd)) * 100;
  log(Math.abs(expected - diffStr) < 1e-9,
    'Differenziale EUR-USD coerente con il paniere completo',
    'atteso ' + expected.toFixed(3) + '% \u00b7 calcolato ' + diffStr.toFixed(3) + '%');

  log(sen.retail.longPct > 0 && sen.retail.longPct < 100 &&
    Math.abs(sen.retail.longPct + sen.retail.shortPct - 100) < 1e-9,
    'Posizionamento retail con percentuali complementari',
    sen.retail.longPct.toFixed(1) + '% long / ' + sen.retail.shortPct.toFixed(1) + '% short');
  log(Math.abs(sen.retail.longPct - 50) < 1 ||
    Math.sign(sen.retail.contrarianScore) === -Math.sign(sen.retail.longPct - 50),
    'Lettura contraria opposta al posizionamento della folla',
    'score contrario ' + sen.retail.contrarianScore.toFixed(2));

  log(sen.risk.score >= 0 && sen.risk.score <= 100 && sen.risk.volIndex >= 0 && sen.risk.volIndex <= 100,
    'Indici di propensione al rischio e di volatilita\u0300 in 0-100',
    sen.risk.label + ' ' + sen.risk.score.toFixed(0) + ', volatilita\u0300 ' + sen.risk.volIndex.toFixed(0));
  log(['Risk-on', 'Risk-off', 'Neutro'].indexOf(sen.risk.label) >= 0,
    'Etichetta del regime di rischio valida', sen.risk.label);

  log(sen.institutional.list.length === 10 && sen.institutional.list[0].net >= sen.institutional.list[9].net,
    'Posizionamento istituzionale per 10 divise, ordinato',
    'piu\u0300 affollata ' + sen.institutional.crowded.currency + ' ' + sen.institutional.crowded.net.toFixed(0) + '%');

  log(sen.components.length === 4 && sen.score >= -1 && sen.score <= 1,
    'Punteggio di sentiment su 4 componenti, in [-1,1]', 'score=' + sen.score.toFixed(3));
  log(['FORTE RIALZO', 'RIALZO', 'NEUTRO', 'RIBASSO', 'FORTE RIBASSO'].indexOf(sen.bias) >= 0,
    'Etichetta di sentiment valida', sen.bias);
  log(sen.reasons.length >= 4, 'Narrazione di sentiment generata', 'righe=' + sen.reasons.length);

  // confluenza dei tre modelli
  var cfAll = SEN.confluence(0.5, 0.4, 0.6);
  log(cfAll.direction === 'BUY' && cfAll.aligned && cfAll.count === 3,
    'Confluenza: tre modelli concordi riconosciuti', 'score=' + cfAll.score.toFixed(3));
  var cfMix = SEN.confluence(0.5, -0.5, 0.0);
  log(!cfMix.aligned && cfMix.count <= 2, 'Confluenza: disaccordo riconosciuto', cfMix.text.slice(0, 40) + '\u2026');
  var cfNone = SEN.confluence(0.05, -0.04, 0.02);
  log(cfNone.direction === 'NEUTRAL', 'Confluenza: segnali deboli restano neutri', 'score=' + cfNone.score.toFixed(3));

  // ---------- 8a-bis. sentiment reale (CFTC COT + VIX + DXY) ----------
  // Costruttore deterministico di un payload equivalente a quello del ponte.
  function fakeCotRows(weeks, startNet, drift) {
    var out = [];
    for (var k = 0; k < weeks; k++) {
      var oi = 500000 + (k % 7) * 1000;
      var netPct = startNet + drift * (k / weeks);          // % dell'open interest
      var net = Math.round(netPct / 100 * oi);
      out.push({
        t: 1600000000000 + k * 7 * 86400000,
        nl: Math.round((oi + net) / 2), ns: oi - Math.round((oi + net) / 2),
        cl: 300000, cs: 200000, oi: oi
      });
    }
    return out;
  }
  function fakeIndex(start, end, n) {
    var out = [];
    for (var k = 0; k < n; k++) {
      out.push({ time: 1700000000000 + k * 86400000,
                 close: start + (end - start) * k / (n - 1) });
    }
    return out;
  }
  var senRealPayload = {
    cot: {
      ok: true, asOf: '2026-10-06', weeks: 120,
      contracts: {
        EUR: { code: '099741', rows: fakeCotRows(120, 2, 12) },     // verso un estremo lungo
        JPY: { code: '097741', rows: fakeCotRows(120, 0, -10) },
        GBP: { code: '096742', rows: fakeCotRows(120, 0, 0) },
        CHF: { code: '092741', rows: fakeCotRows(120, 0, 0) },
        CAD: { code: '090741', rows: fakeCotRows(120, 0, 0) },
        AUD: { code: '232741', rows: fakeCotRows(120, 0, 0) },
        NZD: { code: '112741', rows: fakeCotRows(120, 0, 0) },
        XAU: { code: '088691', rows: fakeCotRows(120, 0, 0) },
        XAG: { code: '084691', rows: fakeCotRows(120, 0, 0) }
      }
    },
    vix: { ok: true, level: 13.5, asOf: '2026-10-09', symbol: '^VIX',
           candles: fakeIndex(30, 13.5, 200) },                     // paura in calo
    dxy: { ok: true, level: 101, asOf: '2026-10-09', symbol: 'DX-Y.NYB',
           candles: fakeIndex(99, 101, 200) }
  };
  var eurRealCandles = D.generateSeries('EUR/USD', 'D1', 0).candles;
  var senR = SEN.analyzeReal(senRealPayload, eurRealCandles, D.INSTRUMENTS[0], { symbol: 'EUR/USD' });
  log(!!senR && senR.real === true && senR.components.length === 4,
    'Sentiment reale: 4 componenti tutte da fonti reali',
    'fonti: ' + senR.sources.join(', '));
  log(senR.score >= -1 && senR.score <= 1 &&
    ['FORTE RIALZO', 'RIALZO', 'NEUTRO', 'RIBASSO', 'FORTE RIBASSO'].indexOf(senR.bias) >= 0,
    'Sentiment reale: punteggio ed etichetta validi',
    'score=' + senR.score.toFixed(3) + ' (' + senR.bias + ')');
  log(senR.strength.list.length === 10 && senR.strength.byCurrency.USD.basis === 'DXY' &&
    senR.strength.byCurrency.EUR.basis === 'COT',
    'Sentiment reale: classifica su tutte le divise con base dichiarata',
    'USD=' + senR.strength.byCurrency.USD.basis + ', EUR=' + senR.strength.byCurrency.EUR.basis);
  var senR2 = SEN.analyzeReal(senRealPayload, eurRealCandles, D.INSTRUMENTS[0], { symbol: 'EUR/USD' });
  log(Math.abs(senR.score - senR2.score) < 1e-12,
    'Sentiment reale: deterministico (stesso input, stesso score)',
    senR.score.toFixed(6));
  log(senR.strength.byCurrency.EUR.score >= 95,
    'Sentiment reale: il percentile segue il posizionamento (estremo lungo riconosciuto)',
    'EUR percentile ' + senR.strength.byCurrency.EUR.score.toFixed(0));
  log(!!senR.retail && senR.retail.excludedFromScore === true && senR.retail.simulated === true,
    'Sentiment reale: il retail resta simulato e fuori dal punteggio',
    'retail ' + senR.retail.longPct.toFixed(0) + '% long, escluso');
  log(senR.risk.label === 'Risk-on' && senR.risk.vixPercentile < 10,
    'Sentiment reale: il VIX basso genera risk-on', 'VIX pctl ' + senR.risk.vixPercentile.toFixed(0));
  log(senR.institutional.simulated === false && senR.institutional.list.length === 9 &&
    senR.institutional.list[0].net >= senR.institutional.list[senR.institutional.list.length - 1].net,
    'Sentiment reale: posizionamento istituzionale da COT, ordinato',
    'affollata ' + senR.institutional.crowded.currency + ' (pctl ' + senR.institutional.crowded.net.toFixed(0) + ')');
  // robustezza: senza VIX e senza DXY il punteggio resta calcolabile
  var senR3 = SEN.analyzeReal({ cot: senRealPayload.cot, vix: null, dxy: null },
    eurRealCandles, D.INSTRUMENTS[0], { symbol: 'EUR/USD' });
  log(senR3.components.length === 3 && isFinite(senR3.score) &&
    senR3.score >= -1 && senR3.score <= 1,
    'Sentiment reale: senza VIX/DXY il punteggio degrada con eleganza (3 componenti)',
    'componenti=' + senR3.components.length + ' score=' + senR3.score.toFixed(3));
  // robustezza: righe COT corrotte non producono NaN
  var corrotto = JSON.parse(JSON.stringify(senRealPayload));
  corrotto.cot.contracts.EUR.rows[119] = { t: 1, nl: 'x', ns: null, cl: 1, cs: 1, oi: 0 };
  var senR4 = SEN.analyzeReal(corrotto, eurRealCandles, D.INSTRUMENTS[0], { symbol: 'EUR/USD' });
  log(isFinite(senR4.score) && senR4.components.every(function (cp) { return isFinite(cp.score); }),
    'Sentiment reale: righe COT corrotte non inquinano il punteggio',
    'score=' + senR4.score.toFixed(3));

  // ---------- 8b. feed dei dati reali (modulo ponte) ----------
  var FX = window.ForexFeed;
  log(!!FX && !!FX.TF_FALLBACK && !!FX.TF_FALLBACK.M10,
    'Modulo feed presente con il timeframe M10', FX.TF_FALLBACK ? FX.TF_FALLBACK.M10.interval : 'mancante');
  log(!!D.TIMEFRAMES.M10 && D.TIMEFRAMES.M10.minutes === 10, 'Il timeframe M10 esiste nel generatore');
  log(typeof FX.loadSentiment === 'function' && typeof FX.loadNews === 'function',
    'Il ponte espone i feed di sentiment reale e notizie/calendario',
    'loadSentiment ' + typeof FX.loadSentiment + ', loadNews ' + typeof FX.loadNews);

  // pulizia delle candele: righe illeggibili, tempi disordinati, OHLC incoerenti
  var filthy = {
    candles: [
      { time: 1000, open: 1.2, high: 1.3, low: 1.1, close: 1.25, volume: 0 },
      { time: 1000, open: 1.25, high: 1.4, low: 1.2, close: 1.35, volume: 10 },
      { time: 500, open: 1.3, high: 1.31, low: 1.29, close: 1.30, volume: 5 },
      { time: 2000, open: null, high: 1.4, low: 1.2, close: 1.3, volume: 1 },
      { time: 3000, open: 1.3, high: 'aaa', low: 1.29, close: 1.305, volume: 2 },
      { time: 4000, open: 1.31, high: 1.33, low: 1.30, close: 1.32, volume: 3 }
    ]
  };
  var clean = FX.sanitizeCandles(filthy.candles);
  log(clean.candles.length === 2 && clean.dropped === 4,
    'Le candele illeggibili vengono scartate', clean.candles.length + ' buone, ' + clean.dropped + ' scartate');
  log(clean.candles[0].time === 1000 && clean.candles[1].time === 4000, 'Restano solo le righe in ordine');

  var senFull = SEN.analyze(oneReal, 'EUR/USD', smcInst, { includeSimulated: true });
  log(senFull.strength.list.length === 10 && senFull.components.length === 4 && senFull.reasons.length >= 4,

  // ---------- 9. Report divulgativo ----------
  var REP = window.Report;
  function glossaryItemsOk(items) {

  }
  var reportCtx = {
    pair: 'EUR/USD', tf: 'H1', horizon: 10,

  };
  var rep = REP.build(reportCtx);

  log(!!REP && rep.blocks.length > 10, 'Report costruito', rep.blocks.length + ' blocchi');

  // il report dichiara la fonte dei dati quando c'e' il ponte attivo
  var repReal = REP.build(Object.assign({}, reportCtx, {
    source: {
      mode: 'real',
      info: {
        provider: 'Yahoo Finance', yahooSymbol: 'EURUSD=X', interval: '5m',
        history: '60 giorni', aggregated: true, bars: 500, stale: false,
        forming: true, lastBarTime: Date.now(), note: null
      },
      error: null
    }
  }));
  log(repReal.blocks.some(function (b) { return b.type === 'h2' && b.text.indexOf('fonte dei dati') > 0; }),
    'Il report include la sezione \u201cLa fonte dei dati\u201d');
  var repRealText = repReal.blocks.filter(function (b) { return b.type !== 'glossary'; })
    .map(function (b) {

      if (b.type === 'table') return b.rows.map(function (r) { return r.join(' '); }).join(' ');

    }).join(' ');
  log(repRealText.indexOf('Yahoo Finance') >= 0, 'Il report cita il fornitore dei dati reali');

  // e quando il ponte manca avvisa che i dati sono simulati
  var repSim = REP.build(Object.assign({}, reportCtx, {
    source: { mode: 'sim', info: null, error: 'server dati locale non trovato: modalità simulata' }
  }));
  log(repSim.blocks.some(function (b) {
    return b.type === 'callout' && b.title.indexOf('dati simulati') > 0;
  }), 'Il report avvisa quando i dati sono simulati');

  var sections = rep.blocks.filter(function (b) { return b.type === 'h2'; });
  log(sections.length >= 6, 'Sezioni presenti nel report',
    sections.map(function (s) { return s.text.slice(0, 3); }).join(' '));

  var glossaryBlock = rep.blocks.filter(function (b) { return b.type === 'glossary'; })[0];
  log(!!glossaryBlock && glossaryBlock.items.length >= 20,
    'Glossario presente e ampio', (glossaryBlock ? glossaryBlock.items.length : 0) + ' voci');
  var glossaryBad = 0;
  (glossaryBlock ? glossaryBlock.items : []).forEach(function (g) {
    if (!g.term || g.term.length < 2) glossaryBad++;
    if (!g.text || g.text.length < 30) glossaryBad++;
  });
  log(glossaryBad === 0, 'Ogni voce di glossario ha termine e spiegazione', 'voci difettose=' + glossaryBad);

  // testo del corpo (escluso il glossario), in minuscolo
  function blockText(b) {
    if (b.type === 'p' || b.type === 'h2') return b.text;
    if (b.type === 'callout') return b.title + ' ' + b.text;
    if (b.type === 'ul') return b.items.join(' ');
    if (b.type === 'table') return b.rows.map(function (r) { return r.join(' '); }).join(' ');

  }
  var bodyText = rep.blocks
    .filter(function (b) { return b.type !== 'glossary'; })
    .map(blockText).join(' ').toLowerCase();

  // ogni termine tecnico usato nel testo deve avere una voce di glossario:
  // e' la verifica automatica della richiesta "spiegazione dei termini usati"
  var missing = [];
  rep.trackedTerms.forEach(function (t) {
    var term = t.toLowerCase();
    if (bodyText.indexOf(term) === -1) return;
    var covered = rep.glossary.some(function (g) {
      var g2 = g.term.toLowerCase();
      return g2.indexOf(term) !== -1 || term.indexOf(g2) !== -1;
    });
    if (!covered) missing.push(t);
  });
  log(missing.length === 0, 'Ogni termine tecnico usato nel report e\u0300 spiegato nel glossario',
    missing.length ? 'non spiegati: ' + missing.join(', ') : 'tutti i termini usati sono coperti');

  // le letture nuove (SuperTrend, Ichimoku, divergenze, pivot) devono comparire
  // nella tabella tecnica e restare spiegate nel glossario
  var nuoviTermini = ['SuperTrend', 'Ichimoku', 'Divergenza', 'Pivot point'];
  var nuoviMancanti = nuoviTermini.filter(function (t) { return bodyText.indexOf(t.toLowerCase()) === -1; });

  // stessa regola del controllo generale: basta che il termine e la voce si

  var nuoviGlossario = nuoviTermini.filter(function (t) {

  info('');

    '%, media ' + bt.avgR.toFixed(3) + ' R/trade, profit factor ' + (isFinite(bt.profitFactor) ? bt.profitFactor.toFixed(2) : 'inf'));

  // ---------- 10. Tabella dei valori attesi, generata dai dati ----------
  // La tabella (tests/expected.js) e' l'unico riferimento dei controlli sulle
  // spiegazioni. Qui si verifica la tabella stessa e il suo funzionamento su
  // dati sintetici: nessuna app, nessun browser.
  var EV = window.ExpectedValues;
  log(!!EV && EV.READS.length >= 100, 'La tabella dei valori attesi e\u2019 caricata e piena',
    EV ? EV.READS.length + ' letture dichiarate \u00b7 ' + EV.STRUCT.length + ' costanti di formula' : 'tabella assente');
  var evLabels = EV.READS.map(function (r) { return r.label; });
  var evDups = evLabels.filter(function (l, i) { return evLabels.indexOf(l) !== i; });
  log(evDups.length === 0, 'Ogni lettura ha un nome proprio: le etichette sono uniche',
    evDups.length ? 'duplicate = ' + evDups.join(', ') : evLabels.length + ' etichette');
  var evKeys = window.CardHelp.keys();

  /* --- l'algoritmo di derivazione, su un markup minimo -------------------
   * Il contratto di una spiegazione e' l'insieme delle letture i cui selettori

   * pannelli appartiene a entrambi, e un pannello vuoto non promette niente. */
  function fixture(markup) {

      'text/html');
  }
  var fixDoc = fixture(
    '<div class="card" data-help="uno"><span id="planTp">1.23456</span></div>' +
    '<div class="card" data-help="due"><span id="dashLadder">1.23456</span></div>' +

  var fixDer = EV.contracts(fixDoc);

  log(Object.keys(fixOwn).sort().join(',') === 'due,quattro,tre,uno',

    (fixDer.uno || []).indexOf('candele in memoria') < 0 &&
    (fixDer.quattro || []).indexOf('candele in memoria') >= 0,
    'Una lettura va alle card che la contengono; un grafico minore ha il suo pannello',

    (fixDer.uno || []).indexOf('operazioni registrate') < 0,
    'Un pannello vuoto non promette niente; uno che mostra numeri si\u0300',
    'tre = ' + ((fixDer.tre || []).length ? fixDer.tre.join(', ') : 'nessuna promessa') +
    ' · quattro = ' + (fixDer.quattro || []).join(' / '));

  /* --- i contratti veri: derivati dal markup dell'app -------------------- */
  /* La selfcheck gira senza app: la pagina dei pannelli si legge dal file. */
  var appDoc = null;
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../index.html', false);

  } catch (e) { appDoc = null; }
  log(!!appDoc && !!appDoc.querySelector('[data-help]'),
    'Il markup dell\u2019app si legge da qui (i contratti vengono dai pannelli, non da un elenco scritto a mano)',
    appDoc ? 'index.html letto \u00b7 ' + appDoc.querySelectorAll('[data-help]').length + ' card' :
      'non leggibile: serve il server locale (python3 server.py)');
  var fxContracts = appDoc ? EV.contracts(appDoc) : {};
  var fxOwners = appDoc ? EV.owners(appDoc) : {};
  var evNoPanel = evKeys.filter(function (k) { return !fxOwners[k]; });
  var evNoKey = Object.keys(fxOwners).filter(function (k) { return evKeys.indexOf(k) < 0; });
  log(appDoc && evNoPanel.length === 0 && evNoKey.length === 0,
    'Ogni spiegazione ha il suo pannello e ogni pannello la sua spiegazione',
    evNoPanel.concat(evNoKey).join(', ') || 'nessun pannello orfano');
  var evUnknown = [];
  Object.keys(fxContracts).forEach(function (k) {

  log(evUnknown.length === 0, 'Ogni promessa derivata corrisponde a una lettura dichiarata nella tabella',

  var evPromised = Object.keys(fxContracts).reduce(function (n, k) { return n + fxContracts[k].length; }, 0);
  log(evPromised >= evKeys.length, 'I pannelli promettono piu\u2019 di una lettura ciascuno',

    evKeys.filter(function (k) { return !(fxContracts[k] || []).length; }).length +
    ' spiegazioni senza promesse (pannelli che riempiono solo i dati del momento)');

  // contesto sintetico: la stessa catena dell'app, con dati generati
  var fxCandles = smcCandles, fxInst = smcInst;
  var fxAnalysis = F.analyze(fxCandles, fxInst, 10);
  var fxSmc = SMC.analyze(fxCandles, fxAnalysis.indicators, fxInst);
  var fxSen = SEN.analyze(cache, 'EUR/USD', fxInst, { includeSimulated: true });
  var fxDiv = window.Divergence.analyze(fxCandles, fxAnalysis.indicators, fxInst,
    { atr: I.last(fxAnalysis.indicators.atr), swings: fxSmc.swings });
  var fxStudy = window.Divergence.backtest(fxCandles, fxAnalysis.indicators, fxInst,
    { horizon: 10, window: 300, swings: fxSmc.swings });
  var fxBt = F.backtest(fxCandles, fxInst, 10, { window: 250 });
  var fxPiv = I.pivotPoints(fxCandles, 60);
  var fxLast = fxCandles[fxCandles.length - 1];
  var fxPrev = fxCandles[fxCandles.length - 2];
  var fxAtr50 = fxAnalysis.indicators.atr.slice(-50).filter(function (x) { return x != null; });
  var fxAvgAtr = fxAtr50.reduce(function (x, y) { return x + y; }, 0) / (fxAtr50.length || 1);
  var fxRange = fxCandles.slice(-100);
  var fxHi = Math.max.apply(null, fxRange.map(function (c) { return c.high; }));
  var fxLo = Math.min.apply(null, fxRange.map(function (c) { return c.low; }));
  var fxCtx = {
    inst: fxInst, digits: fxInst.digits, pair: 'EUR/USD', tf: 'H1', tfLabel: '1 ora',
    horizon: 10, source: 'sim', activeLayers: ['Medie', 'SMC'],
    price: fxLast.close, changePct: (fxLast.close - fxPrev.close) / fxPrev.close * 100,
    lastVolume: fxLast.volume,
    series: { instrument: fxInst, timeframe: 'H1', candles: fxCandles, source: 'sim',
      info: { provider: 'serie sintetica', bars: fxCandles.length, dropped: 3, hasVolume: true } },
    analysis: fxAnalysis, smc: fxSmc, sentiment: fxSen, divergence: fxDiv, divStudy: fxStudy,
    backtest: fxBt, pivots: fxPiv, confluence: cfAll, market: cache, newsSources: 5,
    shown: { ob: 3, fvg: 3, liq: 4, divergences: 2, pivots: 7, news: 5, calendar: 3, watchlist: 14, journal: 1 },
    context: { sessions: ['Londra'], hourUtc: new Date().getUTCHours(),
      volRatio: fxAnalysis.atr / fxAvgAtr, volBars: 50,
      volLabel: 'stabile', rangeBars: fxRange.length, rangeBarsWanted: 100, rangeLow: fxLo,
      rangeHigh: fxHi, rangePosition: (fxAnalysis.price - fxLo) / (fxHi - fxLo) * 100,
      spread: fxInst.spread, day: 'marted\u00ec', adx: fxAnalysis.adx },
    news: [{ time: Date.now() - 3600000, source: 'agenzia di prova', kind: 'wire',
      title: 'Titolo di prova per la tabella' }],
    calendar: [{ time: Date.now() + 7200000, country: 'EUR', impact: 'High', title: 'Evento di prova' }],
    /* Il registro con una operazione dentro: cosi' si prova anche il ramo del
     * registro pieno, non solo la frase del registro vuoto. */
    journal: [{ time: Date.now() - 86400000, symbol: 'EUR/USD', tf: 'H1', direction: 'BUY',
      entry: fxAnalysis.price, outcome: 'win' }]
  };
  function nowTextOf(key, ctx) {
    var e = window.CardHelp.EXPLAIN[key];
    var lines = e && e.now ? e.now(ctx) : [];
    return lines.map(function (l) { return l && typeof l === 'object' ? (l.text || '') : String(l); })
      .join(' . ');
  }
  var fxBad = [], fxMissing = [], fxEmpty = [], fxNums = 0, fxStamps = 0;
  evKeys.forEach(function (key) {
    var r = EV.check(key, fxCtx, nowTextOf(key, fxCtx), fxContracts[key]);
    fxNums += r.cited;
    fxStamps += r.stamps.length;
    r.unresolved.forEach(function (c) { fxBad.push(key + ':' + c.raw); });
    r.unresolvedStamps.forEach(function (s) { fxBad.push(key + ':data ' + s.raw); });
    r.missing.forEach(function (m) { fxMissing.push(key + ':' + m); });
    if (r.promised > 0 && r.cited === 0) fxEmpty.push(key);
  });
  log(fxBad.length === 0, 'Su dati sintetici nessuna spiegazione inventa numeri',
    fxNums + ' numeri in ' + evKeys.length + ' spiegazioni \u00b7 fuori tabella = ' + (fxBad.join(', ') || 'nessuno'));
  log(fxMissing.length === 0, 'Su dati sintetici ogni spiegazione cita le grandezze che promette',
    'promesse non mantenute = ' + (fxMissing.join(', ') || 'nessuna'));
  log(fxEmpty.length === 0, 'Ogni spiegazione porta almeno un dato del momento',
    fxEmpty.length ? 'senza numeri = ' + fxEmpty.join(', ') : 'tutte con numeri');
  log(fxStamps > 0, 'Le date citate (calendario, orologio) corrispondono ai dati',
    fxStamps + ' date/orari verificati');

  /* Una lettura che un pannello mostra ma che resta sempre senza valore e' una
   * promessa vuota: il pannello la disegnerebbe dal nulla. Su un contesto
   * completo devono avere un valore tutte le letture collegate a un pannello. */
  var fxView = EV.view(fxCtx);
  var boundReads = EV.READS.filter(function (r) {
    return r.card.length && !r.card.every(function (c) { return c.shown; });
  });
  var boundNull = boundReads.filter(function (r) {
    var v = r.get(fxView, fxCtx);
    return !(typeof v === 'number' && isFinite(v));
  });
  /* Non e' un errore: alcuni pannelli mostrano una voce solo quando i dati la
   * portano (il VIX con il sentiment reale, i livelli di proiezione oltre il
   * numero che questo contesto produce). Serve a vederli, non a farli sparire. */
  info('  letture collegate a un pannello senza valore in questo contesto: ' +
    (boundNull.length ? boundNull.length + ' su ' + boundReads.length + ' (' +
      boundNull.slice(0, 6).map(function (r) { return r.label; }).join(', ') +
      (boundNull.length > 6 ? '\u2026)' : ')') : 'nessuna'));

  // prova di mutazione: la tabella deve accorgersi di un numero sbagliato
  var btText = nowTextOf('backtest', fxCtx);
  var btLie = btText.replace(/Scambi simulati: \d+/, 'Scambi simulati: 999');
  var dpText = nowTextOf('dashPrice', fxCtx);
  var dpLie = dpText.replace(/1\.\d{5}/, '9.99999');
  var btLieRes = EV.check('backtest', fxCtx, btLie, fxContracts.backtest);
  var dpLieRes = EV.check('dashPrice', fxCtx, dpLie, fxContracts.dashPrice);
  log(!btLieRes.ok && !dpLieRes.ok, 'La tabella intercetta un conteggio e un prezzo sbagliati',
    'conteggio = ' + ((btLieRes.unresolved[0] || {}).raw || btLieRes.missing[0] || 'non intercettato') +
    ' \u00b7 prezzo = ' + ((dpLieRes.unresolved[0] || {}).raw || dpLieRes.missing[0] || 'non intercettato'));
  log(EV.check('backtest', fxCtx, btText, fxContracts.backtest).ok,
    'Il testo corretto passa: il controllo non e\u2019 compiacente');

  // lettura di numeri, date e orari
  var parsed = EV.cited('Orario previsto: 14/10/2026, 04:10:00 \u00b7 %K = 77.2 (14,3) \u00b7 variazione -0.01%');
  log(parsed.stamps.length === 1 &&
    parsed.numbers.map(function (x) { return x.raw; }).join(',') === '77.2,14,3,-0.01',
    'Date e orari si leggono prima dei numeri e la virgola separa le voci',
    parsed.stamps.length + ' data \u00b7 numeri = ' +
    parsed.numbers.map(function (x) { return x.raw; }).join(','));

  // confronto con la pagina: una card finta con i valori dei dati
  var probe = document.createElement('div');
  probe.id = 'pivotGrid';
  var fxP = fxPiv.classic;
  probe.innerHTML = [['Pivot', fxP.p], ['R1', fxP.r1], ['R2', fxP.r2], ['R3', fxP.r3],
    ['S1', fxP.s1], ['S2', fxP.s2], ['S3', fxP.s3]]
    .map(function (c) {
      return '<span class="kpi">' + c[0] + ' ' + c[1].toFixed(fxInst.digits) + '</span>';
    }).join('');
  document.body.appendChild(probe);
  var cardsOk = EV.compareCards(fxCtx, document);
  log(cardsOk.bad.length === 0, 'Una card con i valori dei dati passa il confronto',
    cardsOk.bad.join(' | ') || cardsOk.checked + ' righe confrontate \u00b7 nessuno scarto');
  probe.querySelector('.kpi').textContent = 'Pivot ' + (fxP.p + 0.01).toFixed(fxInst.digits);
  var cardsBad = EV.compareCards(fxCtx, document);
  log(cardsBad.bad.length > 0, 'Un valore sbagliato nella card viene intercettato',
    cardsBad.bad.join(' | ').slice(0, 90) || 'non intercettato');
  probe.parentNode.removeChild(probe);

  } catch (err) {
    fail++;
    var crash = 'FAIL  ECCEZIONE DURANTE I TEST: ' + (err && err.message ? err.message : err) +
      ' @ ' + (err && err.stack ? String(err.stack).split('\n')[1] : 'posizione sconosciuta');
    var pcrash = document.createElement('pre');
    pcrash.className = 'fail';
    pcrash.textContent = crash;
    out.appendChild(pcrash);
    reportLines.push(crash);
  }

  var sum = document.getElementById('summary');
  sum.textContent = fail === 0
    ? 'TUTTI I TEST SUPERATI: ' + pass + '/' + (pass + fail) + (errors.length ? '  (errori JS: ' + errors.join('; ') + ')' : '')
    : 'TEST FALLITI: ' + fail + ' su ' + (pass + fail);
  sum.className = fail === 0 ? 'pass' : 'fail';
  reportLines.push('');
  reportLines.push('SUMMARY: ' + sum.textContent + (errors.length ? ' | errori JS: ' + errors.join(' ; ') : ''));

  // Invio del report in testo semplice all'harness locale (se presente).
  // In apertura diretta con file:// l'invio fallisce silenziosamente.
  try {
    var payload = reportLines.join('\n');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/report', false);
    xhr.setRequestHeader('Content-Type', 'text/plain');
    xhr.send(payload);
  } catch (e) { /* nessun harness in ascolto: nessun problema */ }
})();
</script>
</body>
</html>
